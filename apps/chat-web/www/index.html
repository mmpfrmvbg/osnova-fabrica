<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Осирис</title>
<link rel="stylesheet" href="style.css"/>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/build/styles/github-dark.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/build/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
.msg-bot code { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 2px 5px; border-radius: 3px; font-size: 0.9em; }
.msg-bot pre { background: #1e1e1e; border-radius: 6px; overflow-x: auto; padding: 0; margin: 8px 0; }
.msg-bot pre code { display: block; padding: 12px; background: transparent; }
.msg-bot ul, .msg-bot ol { padding-left: 20px; margin: 6px 0; }
.msg-bot table { border-collapse: collapse; margin: 8px 0; }
.msg-bot th, .msg-bot td { border: 1px solid #444; padding: 4px 10px; }
#tab-bar { position:fixed; bottom:0; left:0; right:0; display:flex;
  background:#1a1a2e; border-top:1px solid #2a2a4e; z-index:200; height:52px; }
.tab-btn { flex:1; background:none; border:none; color:#666; font-size:12px;
  cursor:pointer; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; padding:0; transition:color 0.2s; }
.tab-btn.active { color:#4a90d9; }
.tab-btn span.tab-icon { font-size:20px; }
.screen { display:none; }
.screen.active { display:flex; flex-direction:column; }
body { padding-bottom:52px; }
</style>
</head>
<body>
<div id="screen-chat" class="screen active">
  <div class="header">Осирис</div>
  <div id="messages"></div>
  <form class="bar" id="form">
    <input id="input" type="text" autocomplete="off" placeholder="Сообщение..."/>
    <button type="button" id="mic-btn" title="Голосовой ввод" style="font-size:18px;background:none;border:none;cursor:pointer;padding:0 6px;">🎤</button>
    <button type="submit">Отправить</button>
  </form>
</div>

<div id="screen-brain" class="screen">
  <div class="header">Мозг</div>
  <div id="brain-content" style="padding:12px;overflow-y:auto;flex:1;"></div>
</div>

<div id="screen-tasks" class="screen">
  <div class="header">Задачи</div>
  <div id="tasks-content" style="padding:12px;overflow-y:auto;flex:1;"></div>
</div>
<div id="server-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#1a1a2e;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9999;">
  <div style="color:#fff;font-size:20px;font-weight:bold;">Введите адрес сервера</div>
  <input id="server-url-input" type="url" placeholder="http://192.168.1.100:3000"
    style="width:80%;padding:10px;font-size:16px;border-radius:8px;border:none;outline:none;"/>
  <button onclick="saveServer()"
    style="padding:10px 24px;font-size:16px;border-radius:8px;background:#4a90d9;color:white;border:none;cursor:pointer;">
    Подключиться
  </button>
  <button onclick="localStorage.removeItem('serverUrl');location.reload();"
    style="background:none;border:none;color:#aaa;font-size:13px;cursor:pointer;margin-top:4px;">
    Сменить сервер
  </button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@capacitor/core@6/dist/capacitor.min.js"></script>
<script>
let BASE = (localStorage.getItem('serverUrl') || '').replace(/\/$/, '');
let USER_ID = localStorage.getItem('osirisUserId') || 'web-user';

function getOfflineQueue() {
  try { return JSON.parse(localStorage.getItem('offlineQueue') || '[]'); } catch { return []; }
}
function saveOfflineQueue(q) {
  localStorage.setItem('offlineQueue', JSON.stringify(q));
}
async function flushOfflineQueue() {
  const q = getOfflineQueue();
  if (!q.length) return;
  for (const msg of q) {
    try {
      await nativeFetch(BASE + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: USER_ID, message: msg })
      });
    } catch { return; }
  }
  saveOfflineQueue([]);
}
window.addEventListener('online', () => { flushOfflineQueue(); });

let thinkingTimers = [];
function showThinking() {
  const el = document.getElementById('thinking-indicator');
  if (!el) return;
  thinkingTimers.forEach(clearTimeout);
  thinkingTimers = [];
  el.textContent = '⋯';
  el.style.display = 'block';
  thinkingTimers.push(setTimeout(() => { el.textContent = 'Осирис думает...'; }, 2000));
  thinkingTimers.push(setTimeout(() => { el.textContent = 'Осирис ищет в памяти...'; }, 5000));
  thinkingTimers.push(setTimeout(() => { el.textContent = 'Осирис выполняет действие...'; }, 10000));
}
function hideThinking() {
  const el = document.getElementById('thinking-indicator');
  if (!el) return;
  thinkingTimers.forEach(clearTimeout);
  thinkingTimers = [];
  el.style.display = 'none';
}

function switchTab(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelector('.tab-btn[data-screen="' + name + '"]').classList.add('active');
  if (name === 'brain') loadBrain();
  if (name === 'tasks') loadTasks();
}

async function loadBrain() {
  const el = document.getElementById('brain-content');
  if (!el) return;
  el.innerHTML = '<p style="color:#666">Загрузка...</p>';
  try {
    const res = await nativeFetch(BASE + '/brain?userId=' + encodeURIComponent(USER_ID));
    if (!res.ok) { el.innerHTML = '<p style="color:#c00">Ошибка загрузки</p>'; return; }
    const data = await res.json();
    const cm = data.coreMemory || {};
    const u = cm.user || {};
    const p = cm.project || {};
    const facts = data.recentFacts || [];

    el.innerHTML = '';

    const cmSection = document.createElement('div');
    cmSection.style.cssText = 'background:#1e1e2e;border-radius:10px;padding:14px;margin-bottom:16px;';

    const cmTitle = document.createElement('div');
    cmTitle.style.cssText = 'color:#a0a0d0;font-size:13px;margin-bottom:10px;font-weight:bold;';
    cmTitle.textContent = 'Core Memory';
    cmSection.appendChild(cmTitle);

    const fields = [
      { label:'Имя', group:'user', key:'name', val: u.name || '' },
      { label:'Роль', group:'user', key:'role', val: u.role || '' },
      { label:'Фокус', group:'user', key:'current_focus', val: u.current_focus || '' },
      { label:'Проект', group:'project', key:'name', val: p.name || '' },
      { label:'Статус', group:'project', key:'state', val: p.state || '' },
    ];
    const inputs = {};
    fields.forEach(f => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:8px;';
      const lbl = document.createElement('span');
      lbl.style.cssText = 'color:#888;font-size:12px;min-width:56px;';
      lbl.textContent = f.label;
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = f.val;
      inp.style.cssText = 'flex:1;background:#12122a;border:1px solid #333;border-radius:6px;padding:6px 8px;color:#ddd;font-size:14px;outline:none;';
      inputs[f.group + '.' + f.key] = inp;
      row.appendChild(lbl);
      row.appendChild(inp);
      cmSection.appendChild(row);
    });

    const saveBtn = document.createElement('button');
    saveBtn.textContent = 'Сохранить';
    saveBtn.style.cssText = 'margin-top:6px;padding:8px 20px;background:#4a90d9;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;';
    saveBtn.onclick = async () => {
      saveBtn.disabled = true;
      saveBtn.textContent = '...';
      try {
        await nativeFetch(BASE + '/brain/core-memory?userId=' + encodeURIComponent(USER_ID), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ patch: {
            user: {
              name: inputs['user.name'].value,
              role: inputs['user.role'].value,
              current_focus: inputs['user.current_focus'].value,
            },
            project: {
              name: inputs['project.name'].value,
              state: inputs['project.state'].value,
            }
          }})
        });
        saveBtn.textContent = '✓ Сохранено';
        setTimeout(() => { saveBtn.textContent = 'Сохранить'; saveBtn.disabled = false; }, 2000);
      } catch {
        saveBtn.textContent = 'Ошибка';
        saveBtn.disabled = false;
      }
    };
    cmSection.appendChild(saveBtn);
    el.appendChild(cmSection);

    const factsSection = document.createElement('div');
    factsSection.style.cssText = 'background:#1e1e2e;border-radius:10px;padding:14px;';
    const factsTitle = document.createElement('div');
    factsTitle.style.cssText = 'color:#a0a0d0;font-size:13px;margin-bottom:10px;font-weight:bold;';
    factsTitle.textContent = 'Факты (' + facts.length + ')';
    factsSection.appendChild(factsTitle);

    function renderFacts(list) {
      Array.from(factsSection.querySelectorAll('.fact-row')).forEach(r => r.remove());
      list.forEach(fact => {
        const row = document.createElement('div');
        row.className = 'fact-row';
        row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #2a2a3e;';
        const txt = document.createElement('span');
        txt.style.cssText = 'flex:1;font-size:13px;color:#ccc;word-break:break-word;';
        txt.textContent = fact.content || fact.text || JSON.stringify(fact);
        const del = document.createElement('button');
        del.textContent = '🗑';
        del.style.cssText = 'background:none;border:none;cursor:pointer;font-size:16px;padding:0 4px;opacity:0.6;';
        del.onclick = async () => {
          if (!fact.id) return;
          del.disabled = true;
          try {
            await nativeFetch(BASE + '/brain/facts/' + fact.id + '?userId=' + encodeURIComponent(USER_ID), { method: 'DELETE' });
            row.remove();
          } catch { del.disabled = false; }
        };
        row.appendChild(txt);
        row.appendChild(del);
        factsSection.appendChild(row);
      });
    }
    renderFacts(facts.slice(0, 20));
    el.appendChild(factsSection);

  } catch(e) {
    el.innerHTML = '<p style="color:#c00">Ошибка: ' + e.message + '</p>';
  }
}

async function loadTasks() {
  const el = document.getElementById('tasks-content');
  if (!el) return;
  el.innerHTML = '<p style="color:#666">Загрузка...</p>';
  try {
    const res = await nativeFetch(BASE + '/tasks?userId=' + encodeURIComponent(USER_ID));
    if (!res.ok) { el.innerHTML = '<p style="color:#c00">Ошибка загрузки</p>'; return; }
    const data = await res.json();
    const tasks = Array.isArray(data) ? data : (data.tasks || []);

    el.innerHTML = '';

    const histBtn = document.createElement('button');
    histBtn.textContent = '📋 История';
    histBtn.style.cssText = 'margin-bottom:12px;padding:8px 16px;background:#2a2a3e;color:#aaa;border:1px solid #333;border-radius:8px;cursor:pointer;font-size:13px;';
    histBtn.onclick = async () => {
      histBtn.disabled = true;
      try {
        const hRes = await nativeFetch(BASE + '/tasks/history?userId=' + encodeURIComponent(USER_ID) + '&limit=20');
        const hData = await hRes.json();
        const hTasks = Array.isArray(hData) ? hData : (hData.tasks || []);
        const modal = document.createElement('div');
        modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;';
        const box = document.createElement('div');
        box.style.cssText = 'background:#1e1e2e;border-radius:12px;padding:16px;max-width:400px;width:100%;max-height:70vh;overflow-y:auto;';
        const title = document.createElement('div');
        title.style.cssText = 'color:#ddd;font-weight:bold;margin-bottom:12px;display:flex;justify-content:space-between;';
        title.innerHTML = 'История задач <span style="cursor:pointer;color:#888;" onclick="this.closest(\'div[style*=fixed]\').remove()">✕</span>';
        box.appendChild(title);
        hTasks.forEach(t => {
          const row = document.createElement('div');
          row.style.cssText = 'padding:8px 0;border-bottom:1px solid #2a2a3e;font-size:13px;color:#aaa;';
          const ts = t.createdAt ? new Date(t.createdAt).toLocaleDateString('ru') : '';
          row.textContent = (ts ? ts + ' — ' : '') + (t.title || t.text || JSON.stringify(t));
          box.appendChild(row);
        });
        if (!hTasks.length) { box.innerHTML += '<p style="color:#666;text-align:center;">Пусто</p>'; }
        modal.appendChild(box);
        modal.onclick = e => { if (e.target === modal) modal.remove(); };
        document.body.appendChild(modal);
      } catch(e) { alert('Ошибка: ' + e.message); }
      histBtn.disabled = false;
    };
    el.appendChild(histBtn);

    const byProject = {};
    tasks.forEach(t => {
      const proj = t.project || 'general';
      if (!byProject[proj]) byProject[proj] = [];
      byProject[proj].push(t);
    });

    Object.keys(byProject).forEach(projName => {
      const group = document.createElement('div');
      group.style.cssText = 'background:#1e1e2e;border-radius:10px;padding:12px;margin-bottom:12px;';
      const projTitle = document.createElement('div');
      projTitle.style.cssText = 'color:#a0a0d0;font-size:13px;font-weight:bold;margin-bottom:8px;';
      projTitle.textContent = projName;
      group.appendChild(projTitle);

      byProject[projName].forEach(task => {
        const row = document.createElement('div');
        const isDone = task.status === 'done' || task.status === 'completed';
        row.style.cssText = 'display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid #2a2a3e;';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = isDone;
        cb.style.cssText = 'margin-top:3px;cursor:pointer;flex-shrink:0;';
        cb.onchange = async () => {
          if (!cb.checked) return;
          cb.disabled = true;
          try {
            await nativeFetch(BASE + '/tasks/' + task.id + '?userId=' + encodeURIComponent(USER_ID), {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: 'done' })
            });
            txt.style.textDecoration = 'line-through';
            txt.style.color = '#666';
          } catch { cb.checked = false; cb.disabled = false; }
        };
        const info = document.createElement('div');
        info.style.cssText = 'flex:1;';
        const txt = document.createElement('div');
        txt.style.cssText = 'font-size:14px;color:' + (isDone ? '#666' : '#ddd') + ';' + (isDone ? 'text-decoration:line-through;' : '');
        txt.textContent = task.title || task.text || task.description || JSON.stringify(task);
        const date = document.createElement('div');
        date.style.cssText = 'font-size:11px;color:#555;margin-top:2px;';
        date.textContent = task.createdAt ? new Date(task.createdAt).toLocaleDateString('ru') : '';
        info.appendChild(txt);
        info.appendChild(date);
        row.appendChild(cb);
        row.appendChild(info);
        group.appendChild(row);
      });
      el.appendChild(group);
    });

    if (!tasks.length) {
      el.innerHTML += '<p style="color:#666;text-align:center;margin-top:40px;">Задач нет</p>';
    }
  } catch(e) {
    el.innerHTML = '<p style="color:#c00">Ошибка: ' + e.message + '</p>';
  }
}

async function nativeFetch(url, options) {
  try {
    const { CapacitorHttp } = Capacitor.Plugins;
    if (CapacitorHttp) {
      const res = await CapacitorHttp.request({
        method: options && options.method ? options.method : 'GET',
        url: url,
        headers: options && options.headers ? options.headers : {},
        data: options && options.body ? JSON.parse(options.body) : undefined,
      });
      return { ok: res.status >= 200 && res.status < 300, json: async () => res.data, text: async () => JSON.stringify(res.data) };
    }
  } catch(e) { console.log('CapacitorHttp failed, falling back', e); }
  return fetch(url, options);
}

function saveServer() {
  const val = (document.getElementById('server-url-input').value || '').trim().replace(/\/$/, '');
  if (!val) return;
  localStorage.setItem('serverUrl', val);
  BASE = val;
  document.getElementById('server-overlay').style.display = 'none';
  init();
}

async function runPipelineViaCapacitor(url, dot, msgs) {
  const taskParam = new URL(url).searchParams.get('task') || '';
  try {
    const startRes = await nativeFetch(BASE + '/pipeline/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task: taskParam })
    });
    const startData = await startRes.json();
    const taskId = startData.taskId;
    if (!taskId) { dot.textContent = '[ошибка] taskId не получен'; return; }

    dot.textContent = '⟳ Запуск...';

    while (true) {
      await new Promise(r => setTimeout(r, 1500));
      const pollRes = await nativeFetch(BASE + '/pipeline/status?taskId=' + encodeURIComponent(taskId));
      const pollData = await pollRes.json();

      if (pollData.phase && pollData.phase !== 'done' && pollData.phase !== 'error') {
        const existing = msgs.querySelector('[data-task-id="' + taskId + '"][data-phase="' + pollData.phase + '"]');
        if (!existing) {
          const s = document.createElement('div');
          s.className = 'msg msg-status';
          s.textContent = '⟳ ' + (pollData.message || pollData.phase);
          s.setAttribute('data-task-id', taskId);
          s.setAttribute('data-phase', pollData.phase);
          msgs.insertBefore(s, dot);
          msgs.scrollTop = msgs.scrollHeight;
        }
      }

      if (pollData.status === 'done' || pollData.status === 'error') {
        dot.textContent = pollData.message || (pollData.status === 'done' ? '[готово]' : '[ошибка]');
        break;
      }
    }
  } catch (err) {
    if (err && err.name === 'TypeError' && err.message && err.message.includes('fetch')) throw err;
    dot.textContent = '[ошибка] ' + err.message;
  }
}

async function streamChat(message, dot, msgs) {
  try {
    const { CapacitorHttp } = Capacitor.Plugins;
    if (CapacitorHttp) {
      dot.textContent = '';
      const res = await CapacitorHttp.request({
        method: 'POST',
        url: BASE + '/chat/stream',
        headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
        data: { userId: USER_ID, message: message }
      });
      const lines = (res.data || '').split('\n');
      let text = '';
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        try {
          const ev = JSON.parse(line.slice(5).trim());
          if (ev.token !== undefined) {
            text += ev.token;
            dot.textContent = text;
          } else if (ev.done) {
            hideThinking();
            if (!text) { dot.textContent = '[пустой ответ]'; }
            else {
              dot.innerHTML = (typeof marked !== 'undefined') ? marked.parse(text) : text;
              if (typeof hljs !== 'undefined') setTimeout(() => hljs.highlightAll(), 0);
            }
          } else if (ev.error) {
            dot.textContent = '[ошибка] ' + ev.error;
          }
        } catch { /* skip */ }
      }
    } else {
      dot.textContent = '';
      let text = '';
      const response = await fetch(BASE + '/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
        body: JSON.stringify({ userId: USER_ID, message: message })
      });
      if (!response.body) {
        dot.textContent = '[ошибка] пустой поток';
        return;
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop() || '';
        for (const part of parts) {
          const line = part.trim();
          if (!line.startsWith('data:')) continue;
          try {
            const ev = JSON.parse(line.slice(5).trim());
            if (ev.token !== undefined) {
              text += ev.token;
              dot.textContent = text;
            } else if (ev.done) {
              hideThinking();
              if (!text) { dot.textContent = '[пустой ответ]'; }
              else {
                dot.innerHTML = (typeof marked !== 'undefined') ? marked.parse(text) : text;
                if (typeof hljs !== 'undefined') setTimeout(() => hljs.highlightAll(), 0);
              }
            } else if (ev.error) { dot.textContent = '[ошибка] ' + ev.error; }
          } catch { /* skip */ }
        }
      }
    }
  } catch (err) { dot.textContent = '[ошибка] ' + err.message; }
}

async function checkOtaAndInit() {
  try {
    const res = await fetch(BASE + '/ota/version');
    if (res.ok) {
      const data = await res.json();
      const remoteVersion = data.version || '';
      const localVersion = localStorage.getItem('webVersion') || '';
      if (remoteVersion && remoteVersion !== localVersion) {
        console.log('[ota] new version', remoteVersion, 'local:', localVersion);
        try {
          const bundleRes = await fetch(BASE + '/ota/bundle');
          if (bundleRes.ok) {
            const hasFilesystem = typeof Capacitor !== 'undefined' &&
              Capacitor.Plugins &&
              Capacitor.Plugins.Filesystem;
            if (hasFilesystem) {
              const { Filesystem, Directory } = Capacitor.Plugins;
              const arrayBuffer = await bundleRes.arrayBuffer();
              const zip = await JSZip.loadAsync(arrayBuffer);
              const writePromises = [];
              zip.forEach((relativePath, zipEntry) => {
                if (!zipEntry.dir) {
                  const p = zipEntry.async('base64').then(base64 => {
                    return Filesystem.writeFile({
                      path: relativePath,
                      data: base64,
                      directory: Directory.Data,
                      recursive: true
                    });
                  });
                  writePromises.push(p);
                }
              });
              await Promise.all(writePromises);
              console.log('[ota] files written, reloading');
            }
            localStorage.setItem('webVersion', remoteVersion);
            location.reload();
            return;
          }
        } catch (bundleErr) {
          console.log('[ota] bundle failed, proceeding normally', bundleErr);
        }
      }
    }
  } catch (e) {
    console.log('[ota] version check failed, proceeding normally', e);
  }
  init();
}

async function init() {
  const msgs = document.getElementById('messages');
  const form = document.getElementById('form');
  const inp = document.getElementById('input');
  const micBtn = document.getElementById('mic-btn');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    micBtn.disabled = true;
    micBtn.title = 'Голосовой ввод недоступен';
    micBtn.style.opacity = '0.3';
  } else {
    micBtn.addEventListener('click', () => {
      const recognition = new SR();
      recognition.lang = 'ru-RU';
      recognition.interimResults = false;
      recognition.onstart = () => { micBtn.textContent = '🔴'; };
      recognition.onend = () => { micBtn.textContent = '🎤'; };
      recognition.onresult = e => {
        inp.value = e.results[0][0].transcript;
        inp.focus();
      };
      recognition.onerror = () => {
        micBtn.textContent = '🎤';
        add('Голосовой ввод недоступен', 'msg-bot');
      };
      recognition.start();
    });
  }

  function add(text, cls) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    if (cls === 'msg-bot') {
      d.innerHTML = (typeof marked !== 'undefined') ? marked.parse(text) : text;
      if (typeof hljs !== 'undefined') hljs.highlightAll();
    } else {
      d.textContent = text;
    }
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  try {
    const r = await nativeFetch(BASE + '/health');
    if (r.ok) {
      add('Подключено ✔', 'msg-bot');
    } else {
      add('Сервер недоступен (status ' + r.status + ')', 'msg-bot');
      return;
    }
  } catch(e) {
    add('Ошибка: ' + e.message, 'msg-bot');
    return;
  }

  function isPipelineRequest(text) {
    const lower = text.toLowerCase();
    return ['сделай приложение','создай приложение','напиши приложение','сгенерируй приложение','нужно приложение','создать приложение','сделай ос-приложение'].some(p => lower.includes(p));
  }

  form.onsubmit = async e => {
    e.preventDefault();
    const t = inp.value.trim();
    if (!t) return;
    inp.value = '';
    add(t, 'msg-user');
    const dot = add('...', 'msg-bot');
    showThinking();

    if (isPipelineRequest(t)) {
      const url = BASE + '/pipeline/stream?task=' + encodeURIComponent(t);
      await runPipelineViaCapacitor(url, dot, msgs);
      hideThinking();
    } else {
      try {
        await streamChat(t, dot, msgs);
        hideThinking();
      } catch (netErr) {
        hideThinking();
        if (!navigator.onLine || netErr.message === 'Failed to fetch') {
          dot.textContent = 'Отправлено в очередь (нет соединения)';
          dot.className = 'msg msg-bot';
          const q = getOfflineQueue();
          q.push(t);
          saveOfflineQueue(q);
        } else {
          dot.textContent = '[ошибка] ' + netErr.message;
        }
      }
    }
  };
}

if (!BASE) {
  document.getElementById('server-overlay').style.display = 'flex';
} else {
  checkOtaAndInit();
}
</script>
<div id="thinking-indicator" aria-live="polite" style="
  display:none; position:fixed; bottom:58px; left:50%; transform:translateX(-50%);
  background:#2a2a3e; color:#a0a0c0; padding:8px 18px; border-radius:20px;
  font-size:13px; pointer-events:none; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,0.4);
"></div>
<nav id="tab-bar">
  <button class="tab-btn active" data-screen="chat" onclick="switchTab('chat')">
    <span class="tab-icon">💬</span><span>Чат</span>
  </button>
  <button class="tab-btn" data-screen="brain" onclick="switchTab('brain')">
    <span class="tab-icon">🧠</span><span>Мозг</span>
  </button>
  <button class="tab-btn" data-screen="tasks" onclick="switchTab('tasks')">
    <span class="tab-icon">✅</span><span>Задачи</span>
  </button>
</nav>
</body>
</html>
