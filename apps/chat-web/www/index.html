<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Осирис</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="header">Осирис</div>
<div id="messages"></div>
<form class="bar" id="form">
  <input id="input" type="text" autocomplete="off" placeholder="Сообщение..."/>
  <button type="submit">Отправить</button>
</form>
<script src="https://cdn.jsdelivr.net/npm/@capacitor/core@6/dist/capacitor.min.js"></script>
<script>
const BASE = 'http://90.156.210.111:3000';

async function nativeFetch(url, options) {
  // Используем CapacitorHttp если доступен (обходит mixed content)
  try {
    const { CapacitorHttp } = Capacitor.Plugins;
    if (CapacitorHttp) {
      const res = await CapacitorHttp.request({
        method: options && options.method ? options.method : 'GET',
        url: url,
        headers: options && options.headers ? options.headers : {},
        data: options && options.body ? JSON.parse(options.body) : undefined,
      });
      return { ok: res.status >= 200 && res.status < 300, json: async () => res.data, text: async () => JSON.stringify(res.data) };
    }
  } catch(e) { console.log('CapacitorHttp failed, falling back', e); }
  return fetch(url, options);
}

(async () => {
  const msgs = document.getElementById('messages');
  const form = document.getElementById('form');
  const inp = document.getElementById('input');

  function add(text, cls) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  // Проверяем сервер
  try {
    const r = await nativeFetch(BASE + '/health');
    if (r.ok) {
      add('Подключено ✔', 'msg-bot');
    } else {
      add('Сервер недоступен (status ' + r.status + ')', 'msg-bot');
      return;
    }
  } catch(e) {
    add('Ошибка: ' + e.message, 'msg-bot');
    return;
  }

  function isPipelineRequest(text) {
    const lower = text.toLowerCase();
    return ['сделай приложение','создай приложение','напиши приложение','сгенерируй приложение','нужно приложение','создать приложение','сделай ос-приложение'].some(p => lower.includes(p));
  }

  form.onsubmit = async e => {
    e.preventDefault();
    const t = inp.value.trim();
    if (!t) return;
    inp.value = '';
    add(t, 'msg-user');
    const dot = add('...', 'msg-bot');

    if (isPipelineRequest(t)) {
      const url = BASE + '/pipeline/stream?task=' + encodeURIComponent(t);
      try {
        const es = new EventSource(url);
        es.onmessage = ev => {
          try {
            const data = JSON.parse(ev.data);
            if (data.phase === 'done' || data.phase === 'error') {
              dot.textContent = data.message || '[готово]';
              es.close();
            } else {
              const s = document.createElement('div');
              s.className = 'msg msg-status';
              s.textContent = '⟳ ' + (data.message || data.phase);
              msgs.insertBefore(s, dot);
              msgs.scrollTop = msgs.scrollHeight;
            }
          } catch { dot.textContent = '[ошибка парсинга]'; es.close(); }
        };
        es.onerror = () => { dot.textContent = '[ошибка соединения]'; es.close(); };
      } catch (err) { dot.textContent = '[ошибка] ' + err.message; }
    } else {
      try {
        const r = await nativeFetch(BASE + '/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: 'android-user', message: t })
        });
        const j = await r.json();
        dot.textContent = j.reply || '[пустой ответ]';
      } catch (err) { dot.textContent = '[ошибка] ' + err.message; }
    }
  };
})();
</script>
</body>
</html>
