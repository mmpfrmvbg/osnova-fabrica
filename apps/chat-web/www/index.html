<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Осирис</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="header">Осирис</div>
<div id="messages"></div>
<form class="bar" id="form">
  <input id="input" type="text" autocomplete="off" placeholder="Сообщение..."/>
  <button type="submit">Отправить</button>
</form>
<script>
const DEFAULT_URL = 'http://90.156.210.111:3000';

async function tryConnect(url) {
  try {
    const r = await fetch(url + '/health', { signal: AbortSignal.timeout(4000) });
    if (r.ok) return true;
  } catch {}
  return false;
}

function startChat(BASE) {
  const msgs = document.getElementById('messages');
  const form = document.getElementById('form');
  const inp = document.getElementById('input');

  function add(text, cls) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  function isPipelineRequest(text) {
    const lower = text.toLowerCase();
    return ['сделай приложение','создай приложение','напиши приложение','сгенерируй приложение','нужно приложение','создать приложение','сделай ос-приложение'].some(p => lower.includes(p));
  }

  add('Подключено: ' + BASE, 'msg-bot');

  form.onsubmit = async e => {
    e.preventDefault();
    const t = inp.value.trim();
    if (!t) return;
    inp.value = '';
    add(t, 'msg-user');
    const dot = add('...', 'msg-bot');

    if (isPipelineRequest(t)) {
      const url = BASE + '/pipeline/stream?task=' + encodeURIComponent(t);
      try {
        const es = new EventSource(url);
        es.onmessage = ev => {
          try {
            const data = JSON.parse(ev.data);
            if (data.phase === 'done' || data.phase === 'error') {
              dot.textContent = data.message || '[готово]';
              es.close();
            } else {
              const s = document.createElement('div');
              s.className = 'msg msg-status';
              s.textContent = '⟳ ' + (data.message || data.phase);
              msgs.insertBefore(s, dot);
              msgs.scrollTop = msgs.scrollHeight;
            }
          } catch { dot.textContent = '[ошибка парсинга]'; es.close(); }
        };
        es.onerror = () => { dot.textContent = '[ошибка соединения]'; es.close(); };
      } catch (err) { dot.textContent = '[ошибка] ' + err.message; }
    } else {
      try {
        const r = await fetch(BASE + '/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: 'android-user', message: t })
        });
        const j = await r.json();
        dot.textContent = j.reply || '[пустой ответ]';
      } catch (err) { dot.textContent = '[ошибка] ' + err.message; }
    }
  };
}

(async () => {
  const ok = await tryConnect(DEFAULT_URL);
  if (ok) {
    startChat(DEFAULT_URL);
  } else {
    document.body.innerHTML =
      '<div style="padding:24px;font-family:sans-serif">' +
      '<p style="color:#c00">Сервер недоступен. Проверьте сеть.</p>' +
      '<p style="font-size:13px;color:#888">' + DEFAULT_URL + '</p>' +
      '<button onclick="location.reload()" style="padding:8px 16px;margin-top:12px">Повторить</button>' +
      '</div>';
  }
})();
</script>
</body>
</html>
