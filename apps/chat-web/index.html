<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Осирис</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="header">Осирис</div>
<div id="messages"></div>
<form class="bar" id="form">
  <input id="input" type="text" autocomplete="off" placeholder="Сообщение..."/>
  <button type="submit">Отправить</button>
</form>
<script>
(async () => {
  window.OSIRIS_SERVER_URL = localStorage.getItem('osiris_url') || '';

  const CANDIDATES = [
    window.OSIRIS_SERVER_URL,
    'http://10.0.2.2:3000',
    'http://localhost:3000',
  ].filter(Boolean);

  let BASE = null;
  for (const candidate of CANDIDATES) {
    try {
      const r = await fetch(candidate + '/server-url',
        { signal: AbortSignal.timeout(1500) });
      if (r.ok) {
        const j = await r.json();
        BASE = (j && typeof j.url === 'string' && j.url) ? j.url : candidate;
        break;
      }
    } catch { /* продолжаем */ }
  }

  if (!BASE) {
    // Показать форму ввода URL вместо падения
    document.body.innerHTML =
      '<div style="padding:24px;font-family:sans-serif">' +
      '<p style="color:#c00">Сервер не найден. Введите адрес:</p>' +
      '<input id="url-inp" style="width:100%;padding:8px;font-size:16px" ' +
      '       placeholder="http://192.168.1.X:3000" /><br><br>' +
      '<button onclick="localStorage.setItem(\'osiris_url\',' +
      'document.getElementById(\'url-inp\').value);location.reload()"' +
      '        style="padding:8px 16px">Подключить</button>' +
      '</div>';
    const saved = localStorage.getItem('osiris_url');
    if (saved) document.getElementById('url-inp').value = saved;
    return;
  }

  window.__OSIRIS_BASE = BASE;

  const msgs = document.getElementById("messages");
  const form = document.getElementById("form");
  const inp = document.getElementById("input");
  function add(text, cls) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }
  form.onsubmit = async e => {
    e.preventDefault();
    const t = inp.value.trim();
    if (!t) return;
    inp.value = "";
    add(t, "msg-user");
    const dot = add("...", "msg-bot");
    try {
      const r = await fetch(window.__OSIRIS_BASE + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId: "android-user", message: t })
      });
      const j = await r.json();
      dot.textContent = j.reply || "[пустой ответ]";
    } catch (err) {
      dot.textContent = "[ошибка] " + err.message;
    }
  };
})();
</script>
</body>
</html>
