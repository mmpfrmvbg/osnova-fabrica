# ============================================================
# spec.yaml — L0 Source of Truth for osnova-fabrica
# Version: 0.1.1
# ============================================================
# ПРАВИЛО: если реальность расходится с этим файлом — исправляется код.
# Исключение: секция tech_debt.
#
# Репозиторий: github.com/mmpfrmvbg/osnova-fabrica
# ============================================================

project:
  name: osnova-fabrica
  version: "0.1.1"
  description: >
    Кодогенератор для языка «Основа».
    Принимает текстовое описание задачи, генерирует .osnova-программу
    через LLM, компилирует в .osvbc байткод, исполняет на стековой VM,
    сверяет с golden-тестами. Repair-loop при ошибках.
    Язык Основа: кириллический синтаксис, VLIW/e2k поддержка, sandbox.
  status: "Phase A — MVP pipeline"
  repository: github.com/mmpfrmvbg/osnova-fabrica
  license: MIT
  last_updated: "2026-03-17"

# ---------------------------------------------------------------------------
# Стек
# ---------------------------------------------------------------------------
stack:
  runtime: "Node.js >= 20"
  language: "TypeScript 5.x, strict: true"
  module_system: CommonJS
  llm_providers:
    qwen-cli:
      type: "CLI subprocess"
      default: true
      note: "OSNOVA_PROVIDER=qwen-cli"
      source: "перенесено из llama-fabrica/src/infrastructure/llm/QwenCliProvider.ts"
      changes_from_original: "удалены зависимости VectorDB/EmbeddingService/RAG (нет в v0.1)"
    deepseek:
      url: "https://api.deepseek.com"
      endpoints: ["/v1/chat/completions"]
      timeout_ms: 300000
      streaming: true
      json_mode: true
      source: "перенесено из llama-fabrica/src/infrastructure/llm/DeepSeekProvider.ts"
    ollama:
      url_default: "http://localhost:11434"
      timeout_ms: 300000
      source: "перенесено из llama-fabrica/src/infrastructure/llm/OllamaProvider.ts"
  testing:
    golden: "golden-tests.json — эталонные .osnova программы + ожидаемый байткод/результат VM"
    runner: "OsnovaGoldenRunner — запускает VM, сверяет output"

# ---------------------------------------------------------------------------
# Структура проекта
# ---------------------------------------------------------------------------
structure:
  root_files:
    - "spec.yaml          # L0 источник правды"
    - "pipeline.yaml      # DAG фаз (6 фаз)"
    - "roles.yaml         # Реестр агентов (3 агента)"
    - "gates.yaml         # Quality gates (3 gates)"
    - ".env.example"
    - "package.json"
    - "tsconfig.json"
    - "tsconfig.typecheck.json"
    - "eslint.config.mjs"

  src:
    llm:
      description: "LLM провайдеры — интерфейсы + реализации QwenCli/DeepSeek/Ollama"
      status: "✅ реализовано в batch-1 (2026-03-17)"
      source: "llama-fabrica/src/infrastructure/llm/ + domain/llm/"
      files:
        - types.ts
        - QwenCliProvider.ts
        - DeepSeekProvider.ts
        - OllamaProvider.ts
        - defaults.ts
        - errors.ts         # LlmError, LlmErrorKind, wrapLlmError (batch-5)
        - index.ts
      notes: >
        QwenCliProvider: удалены VectorDB/EmbeddingService зависимости — в v0.1 RAG не нужен.
        При появлении RAG в v0.2 — добавить как опциональный параметр конструктора.

    compiler:
      description: "Компилятор языка Основа: .osnova → .osvbc (JSON байткод)"
      pipeline: "tokenize → parse → compile → JSON"
      status: "✅ реализовано в batch-2 (2026-03-17)"
      source: "создано с нуля по docs/grammatika-v0.1.md"
      files:
        - lexer.ts
        - parser.ts
        - ast.ts
        - codegen.ts
        - compiler.ts
        - language-registry.ts
        - cli.ts

    runtime:
      description: "Рантайм: исполнение .osvbc байткода на стековой VM"
      status: "✅ реализовано в batch-2 (2026-03-17)"
      source: "создано с нуля"
      files:
        - vm/
        - runner.ts
        - sandbox.ts
        - storage.ts
        - goldenApps.ts
        - types.ts
        - ui.ts
        - cli.ts

    vliw:
      description: "VLIW-планировщик (модель e2k): граф зависимостей, list scheduling, упаковка в VLIW-пакеты."
      status: "✅ реализовано в batch-2 (2026-03-17). Не интегрирован в pipeline — см. DEBT-001."
      files:
        - scheduler.ts
        - dependencyGraph.ts
        - e2kModel.ts
        - cli.ts
        - index.ts

    agents:
      description: "3 агента MVP. Получают/отдают строго типизированные артефакты."
      status: "✅ реализовано в batch-3/5 (2026-03-17). LlmError + logger добавлены в batch-5."
      files:
        - IntakeAgent.ts
        - OsnovaCodegen.ts
        - RepairEngineer.ts

    pipeline:
      description: "Оркестратор 6 фаз по pipeline.yaml. Читает gates.yaml для чекпоинтов."
      status: "✅ реализовано в batch-3 (2026-03-17). Линейный оркестратор (DAG — v0.2, DEBT-002)."
      files:
        - orchestrator.ts
        - gateChecker.ts
        - types.ts
      notes: >
        pipeline/types.ts — единственный источник правды для типов артефактов.
        gates.yaml и pipeline.yaml ссылаются на поля BuildReport/GoldenReport
        по именам из этого файла. При расхождении — исправляется types.ts.

    trace:
      description: "Запись трейсов прогонов в JSONL для дообучения LLM"
      status: "✅ реализовано в batch-4 (2026-03-17)"
      files:
        - traceStore.ts
        - types.ts

    logger.ts:
      description: "Общий логгер с LOG_LEVEL: debug/info/warn/error. Используется всеми агентами."
      status: "✅ реализовано в batch-5 (2026-03-17)"

    cli.ts:
      description: "Точка входа: osnova-fabrica --task '...' --provider qwen-cli"
      status: "✅ реализовано в batch-3/5 (2026-03-17)"

  golden:
    description: "Эталонные .osnova программы + ожидаемые результаты (5 голден-приложений)"
    status: "✅ реализовано в batch-2 (2026-03-17). Все 5 приложений проходят в CI."
    files:
      - golden-tests.json
      - runner.ts

  examples:
    description: "Примеры программ на языке Основа"
    source: "docs/grammatika-v0.1.md"

# ---------------------------------------------------------------------------
# Pipeline (см. pipeline.yaml)
# ---------------------------------------------------------------------------
pipeline:
  description: "task → intent → spec → codegen → build → golden_check → [repair]"
  phases: 6
  detail: "см. pipeline.yaml"

# ---------------------------------------------------------------------------
# Агенты (см. roles.yaml v0.1.1)
# ---------------------------------------------------------------------------
agents:
  count: 3
  detail: "см. roles.yaml"
  list:
    - IntakeAgent
    - OsnovaCodegen
    - RepairEngineer
  notes: >
    IntakeAgent имеет явное поле modes: [intent, spec] (см. roles.yaml).
    При выделении SpecArchitect в v0.2 — IntakeAgent остаётся только с mode=intent.

# ---------------------------------------------------------------------------
# Gates (см. gates.yaml)
# ---------------------------------------------------------------------------
gates:
  count: 3
  detail: "см. gates.yaml"
  list:
    - G1_spec_ready
    - G2_build_pass
    - G3_golden_pass
  notes: >
    Единый источник порогов — src/pipeline/thresholds.ts (QUALITY_PASS, QUALITY_PARTIAL).
    pipeline.yaml и gates.yaml содержат комментарии со ссылкой на thresholds.ts.
    G3: pass=0.7, partial=0.5 (partial_success — трейс для дообучения).
    Типы полей (lexerErrors, vmErrors, etc.) строго по src/pipeline/types.ts.

# ---------------------------------------------------------------------------
# Переменные окружения
# ---------------------------------------------------------------------------
env:
  required:
    OSNOVA_PROVIDER:
      values: [qwen-cli, deepseek, ollama]
      default: qwen-cli
    DEEPSEEK_API_KEY: "Обязателен при provider=deepseek"
  optional:
    OSNOVA_MODEL:
      default: qwen-coder-plus
    OLLAMA_URL:
      default: "http://localhost:11434"
    OSNOVA_TRACE_DB:
      default: "./runs/traces.jsonl"
      note: "Путь к JSONL-файлу трейсов (для дообучения LLM и диагностики)"
    LOG_LEVEL:
      default: info
      values: [debug, info, warn, error]
      note: "Читается в validateEnv(), применяется через setLogLevel() в src/logger.ts"
    QWEN_TIMEOUT_MS:
      default: 300000
      note: "таймаут для QwenCliProvider (мс)"

# ---------------------------------------------------------------------------
# Язык Основа
# ---------------------------------------------------------------------------
osnova_language:
  description: >
    Русскоязычный язык программирования с VLIW-поддержкой.
    Синтаксис читается как структурированный русский текст.
    Целевая платформа: VLIW-процессоры (модель e2k).
  version: "0.1"
  grammar_source: "docs/grammatika-v0.1.md"
  pipeline: ".osnova → компилятор → .osvbc (байткод JSON) → VM"
  builtin_types:
    integers: [Целоа8, Целое30, Целое32, Целое64]
    floats: [Вещественное32, Вещественное64]
    other: [Логический, Строка, Байт, Ничто]
    option: "?Тип"
    reference: "ссылка Тип"
  keywords_count: 39
  key_constructs:
    procedure: { syntax: "процедура имя(арг: Тип): Тип", implemented: true }
    function: { syntax: "функция имя(арг: Тип): Тип", implemented: false }
    if: { syntax: "если ... иначе_если ... иначе", implemented: false }
    loop_while: { syntax: "пока условие { ... }", implemented: true }
    loop_for: { syntax: "для_каждого переменная в выражение", implemented: true }
    match: { syntax: "совпадает ... когда Успех(v) / когда Неудача(e)", implemented: false }
    actor: { syntax: "актор + канал + ожидать", implemented: false }
    result: { syntax: "Результат<T,E>, Успех(v), Неудача(e)", implemented: true }
    parallel: { syntax: "параллельно {} — явный параллельный блок (VLIW hint)", implemented: false }
    predvybor: { syntax: "предвыбор { когда условие: выражение }", implemented: false }
    packet: { syntax: "пакет { слот0: ...; слот1: ... }", implemented: false }
    syscall: { syntax: "система.хранилище, система.окно, система.сеть — invoke-API", implemented: true }
  note_on_llm: >
    LLM хуже генерирует кириллический код чем латинский.
    Поэтому few-shot примеры в промпте обязательны.
    Golden-тесты — ключевой критерий качества генерации.

# ---------------------------------------------------------------------------
# Технический долг
# ---------------------------------------------------------------------------
tech_debt:
  DEBT-001:
    title: "VLIW не интегрирован в pipeline"
    priority: low
    status: open
    note: "Планировщик работает и покрыт тестами. Интеграция в runPipeline — v0.2+."
  DEBT-002:
    title: "Нет DAG-оркестратора — pipeline линейный в v0.1"
    priority: medium
    status: open
    note: "В v0.1 хардкодим цепочку фаз, DAG из pipeline.yaml — в v0.2"
  DEBT-003:
    title: "Нет инструментов покрытия для языка Основа"
    priority: low
    status: open
    note: "G3_golden_pass заменяет coverage — golden-тесты как proxy"
  DEBT-004:
    title: "QwenCliProvider без RAG — паттерны few-shot только из golden-tests"
    priority: low
    status: open
    note: "VectorDB/EmbeddingService удалены при переносе. Добавить в v0.2 как опцию."
  DEBT-005:
    title: "Общий логгер с LOG_LEVEL"
    priority: medium
    status: closed
    closed_in: batch-5 (2026-03-17)
    note: "Реализовано: src/logger.ts + setLogLevel() в validateEnv()."
  DEBT-006:
    title: "Типы ошибок LLM-агентов не стандартизированы"
    priority: medium
    status: closed
    closed_in: batch-5 (2026-03-17)
    note: "Реализовано: src/llm/errors.ts (LlmError + wrapLlmError). Все 3 агента вращивают ошибки provider.complete()."

debt_summary:
  total_items: 6
  open: 4
  closed: 2
  critical_open: 0

