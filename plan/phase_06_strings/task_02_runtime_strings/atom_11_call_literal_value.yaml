notes: >-
  СЛОЙ (1) ERR-0002 — ПО ОБЪЯВЛЕННОМУ ВЛАДЕЛЬЦУ ЗАПАСНОМУ ХОДУ (ответа про VLIW
  нет третий заход).


  ЧТО БЫЛО: `пусть а = три(); пусть б = три(); вывести а + б` при `процедура
  три() → Строка / вернуть "абв"`

  собиралось с НУЛЁМ отказов и печатало `2228212` — СУММУ ДВУХ АДРЕСОВ статики
  (одиннадцатая тихая ложь).

  Слой (2) (ATOM-06-02-08, коммит 3ea2efb4) закрыл ложь НАЗВАННЫМ ОТКАЗОМ; слой
  (1) обязан дать ЗНАЧЕНИЕ.


  КОРЕНЬ (замер `.tmp/err2-носители.ts`, форма A): карта `callValues`
  доказательства заполнялась ТОЛЬКО для

  вызовов, возвращающих СВОЙ ПАРАМЕТР (`returnedParamOf`). У вызываемой,
  возвращающей ЛИТЕРАЛ, возвращаемого

  параметра нет — приёмник оставался клеткой без факта, и обе стороны `+`
  уходили в арифметику.


  НОСИТЕЛИ ЗАМЕРЕНЫ, А НЕ ПРЕДПОЛОЖЕНЫ:
    #0 IR.const reg[0] imm(0) imm(2)   ← литерал
    #1 IR.ret imm(1) reg[0]            ← возврат СО ЗНАЧЕНИЕМ
    #2 IR.ret imm(0) reg[0]            ← пустой возврат СРАЗУ за ним (мёртв)

  ПРАВКА (только `src/e2k/stringValueProof.ts`): `ReturnFact.hasValue` (без него
  пустой возврат неотличим от

  «значение не доказано»), функция `returnedValueOf` и ветвь в заполнении
  `callValues`. Условия звучания —

  каждое проверено замером:
    (1) ПРОЦЕДУРА ПРЯМОЛИНЕЙНА: `walks[]` — линейный проход, в процедуре с переходами он берёт значение ОДНОЙ
        ветви (форма Ж замера: `#3 IR.jmp_if_not reg[1] imm(6)`);
    (2) все возвраты со значением несут ОДНО И ТО ЖЕ значение-строку (форма Г: разные литералы — не одно);
    (3) пустой возврат допустим только как МЁРТВЫЙ — непосредственно за возвратом со значением. Форма З
        замера — почему одного этого правила МАЛО: `#3 IR.jmp_if_not imm(6)` ведёт ИМЕННО в `#6 IR.ret imm(0)`,
        то есть «стоящий сразу за возвратом» пустой возврат ЖИВ; принять его за мёртвый = напечатать
        выдуманное «абв»;
    (4) пара (`IR.ret_result`) строкового значения не несёт; вызываемая, возвращающая параметр, идёт прежним
        путём (там значение зависит от САЙТА).

  ОРАКУЛ — НАПИСАН ДО КОДА И БЫЛ КРАСНЫМ РОВНО ДВАЖДЫ
  (`src/e2k/stringConcatRuntime.test.ts`): Ф9 (требование

  верной склейки вместо отказа) и Ф10 (значение вызова кормит СРЕЗ). Контроли
  при этом были ЗЕЛЁНЫМИ:

  Ф11 (граница: вызываемая с переходом — отказ по имени) и Ф12 (ловушка: пустой
  возврат под переходом —

  отказ, а не выдуманный текст). Ф8 переписана: смешанная форма `а + "|"` из
  вызова-ЛИТЕРАЛА теперь

  склеивается («абв|»), а границу случая 46 держит новая Ф13 (сторона из вызова
  без доказанного значения).


  ИЗМЕРЕНО НА МОДЕЛИ: «абвабв» (Ф7/Ф9, было `2228212`), «б» (Ф10:
  `подстрока(три(), 1, 2)`), «абв|» (Ф8),

  прежние числа удержаны (6, 5, 5/30).


  ЖЕЛЕЗО (Эльбрус E8C2, Elbrus Linux 8.1, ядро 6.1.0-0.8-e8c2): **5 из 5 проб
  совпали БАЙТ В БАЙТ, код 0**;

  `er2-a` напечатал `320 260 320 261 320 262 320 260 320 261 320 262` = «абвабв»
  — ложь закрыта на ЦЕЛИ, а не

  только на модели; sha256 совпал в трёх местах (таблица, машина, сверка),
  ожидания сверены с МОДЕЛЬЮ ДО

  поездки (`.tmp/er2-железо-сверка.ts`, 5/5). Стенд `.tmp/er2-hw/`, отчёт
  `.tmp/er2-hw/report-hw.txt`.


  ДВЕ ЛОВУШКИ ЭТОГО ЗАХОДА, обе пойманы проверками, а не глазом:
    1. ТАБЛИЦА СТЕНДА БЕЗ РАСШИРЕНИЯ: имена в `sha256.tsv` были `er2-a`, а водитель открывает `bin/$name` —
       «No such file or directory». Поймано СВЕРКОЙ С МОДЕЛЬЮ ДО поездки (не на железе);
    2. КОММИТ ПРЕДЫДУЩЕГО ЗАХОДА ОСТАВИЛ `npm test` КРАСНЫМ, и это НЕ было замечено: правка доков
       (docs/hardware-debt.md §3.175) содержала ссылку `src/runtime/vm/stringUnits.ts:58-73`, а
       `src/scripts/e2kDocRefs.audit.test.ts` запрещает «файл:строка» в доках (нужна ссылка на СИМВОЛ).
       После правки доков прогонялся только `docs:check`, а аудит ссылок живёт в ОБЩЕМ прогоне. Правило:
       после ЛЮБОЙ правки доков — общий прогон, а не только сторож доков. Ссылка заменена на
       `src/runtime/vm/stringUnits.ts#codePointSlice`.

  ЧИСЛА: `npm test` 244 / 3896 (+4 пробы; было 3892), `gate:qemu` 44 / 431 (было
  427), `tsc` чист,

  `docs:check` 161 / 0 / 45. Переписи лексера (тело 76 / файл 35) НЕ сдвинулись
  — правка сняла отказы у

  программ с вызываемой-ЛИТЕРАЛОМ, а лексер отдаёт значения параметров.


  ОСТАТОК ERR-0002 (названный): вызываемая с ПЕРЕХОДОМ, разные литералы на
  путях, значение из рантайма —

  по-прежнему НАЗВАННЫЙ отказ (Ф11/Ф13). Улучшение требует свёртки по путям для
  возвратов.
