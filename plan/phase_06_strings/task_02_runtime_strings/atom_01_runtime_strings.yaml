notes: "СДЕЛАНО коммитом e7bfb649 (Шаг 1 закрыт). ФАКТЫ ЗАКРЫТИЯ. §10.2 поправлен замером ДО кода: тег 2*wbs = %r8, нагрузка 2*wbs+1 = %r9 (CALL_WBS = 4); пропуск слота (%r16/%r18 из устаревшего комментария procedureCall.ts) отменён — 2*wbs+2 = %r10 есть первая закреплённая клетка (RESERVED_FROM = 10, долг 53). Оракул src/e2k/resultLowering.test.ts (8 проверок, gate:qemu): проба различающая (ветвь «Неудача» берётся только по прочитанному тегу) — модель 5 / 249 / 237. ЖЕЛЕЗО (Эльбрус E8C2, Elbrus Linux 8.1, ядро 6.1.0-0.8-e8c2, SP 1.27.15): sha256 сверен до прогона (3/3), те же числа 5 / 249 / 237 — модель = железо 3/3, D4 выполнен (на Неудача нагрузка — значение ошибки, не мусор). Носители: IR.ret_result [тег, нагрузка] (4 команды: 2 movts + return + ct) и IR.result_pick [приёмник, якорь] (1 команда, ЭФФЕКТ — планировщик не переносит). Обе клетки канала зарезервированы УСЛОВНО (только у образов с парой). ПЕРЕМЕР: npm test 236 файлов / 3803 проверки — все зелёные (в т.ч. «458 / 53 / 511 держатся»); gate:qemu 37 / 327 (в т.ч. «FIR целиком: 181», корпус на цели 41/41); check:test-files — расхождений нет; docs:check 161 / 0; golden, tsc, lint — чисто. ЦЕНА: до 4 команд на возврат пары + 1 на чтение нагрузки, у программ без пары 0 байт (резерв условен) — поэтому 458/53/511, образ 6856 и FIR 181 держатся. ГРАНИЦЫ: раскладка, ABI и окно не тронуты (CALL_WBS = 4, RESERVED_FROM = 10, INNER_CALL_WBS = 16, MAX_CALL_ARGS = 3); новых строк форм ровно две. ПРОБЕЛЫ НАЗВАНЫ: канон language-v2.md Результат не описывает и в схему языка поверхность не внесена; ?Т/пусто не определены; Результат<Строка, ...> и структура Ошибка прогоном не проверены; глубина 2 формой описана, прогоном нет. ДАЛЬШЕ: Шаг 2 (ATOM-06-02-02) — Строка.срез/склейка на готовом понижении, после доклада владельцу и ПАУЗЫ. Handoff — handoff/ATOM-06-02-01.md."
