notes: >-
  СТАТИЧЕСКАЯ ПОЛОВИНА 06-02 (2026-11-05, владелец: «шаг 4 — 06-02, только после
  75 и 76»). Отдельный атом, потому что это ДРУГАЯ работа, чем ATOM-06-02-02:
  там рантайм-срез с неизвестной длиной (нужен ЦИКЛ и переходы — граница
  `twoPassLayout.ts`, закрытая владельцем), здесь срез, которому цикл НЕ нужен.


  СДЕЛАНО (только `src/e2k/stringPlan.ts`; раскладка/VLIW/ABI не тронуты): ветвь
  `система.строка.подстрока` в плане строк — если строка ДОКАЗАНА (`registerOf`)
  и ОБА края константы, результат вычисляет СБОРКА и кладёт статическим блобом
  (значение регистрируется в `values`, адрес даёт `IR.const`); иначе — НАЗВАННЫЙ
  отказ. Семантика взята у ЭТАЛОНА `codePointSlice`
  (`src/runtime/vm/stringUnits.ts`): счёт по КОДОВЫМ ТОЧКАМ, конец ИСКЛЮЧАЮЩИЙ,
  выход за границы обрезается, `конец <= начало` → пустая строка, суррогатная
  пара не разрывается. Новый вид правки `slice` ЗАМЕНЯЕТ носитель целиком —
  потому что `kind:'const'` меняет только операнд и на вызове молча оставляла
  `IR.invoke` (дефект, пойман замером `strings.code[#3]`).


  ДВЕНАДЦАТАЯ ТИХАЯ ЛОЖЬ, найденная по дороге (`ERR-0003`): `isStringPrint`
  требовал пометки `> 0`, поэтому ПУСТАЯ строка печаталась АДРЕСОМ числом —
  `вывести ""` → `1114112`, пустой срез → `1114100`, при 0 отказов и коде 0.
  Ложь жила ДО среза (измерена на HEAD пробами П1/П2), починка `>= 0`, обратная
  сторона закреплена П3.


  ИЗМЕРЕНО (модель, оракул `src/e2k/stringSliceStatic.test.ts`, 11 проб, оба
  прогона): `бв`, `аб`, `жз`, `🙂` (суррогат цел), `вгде` (обрезка), `3`, пусто
  (ОБ1/ОБ2 контроли), `5`/`42`. Отказы названы: края из рантайма, строка из
  рантайма, отрицательный край от конца (`-2` приезжает ВЫЧИСЛЕННЫМ регистром).


  ЖЕЛЕЗО (2026-11-05, Эльбрус E8C2, `w205p.mcst.ru:8194`): 8 проб повезли на
  цель, **8 из 8 совпали БАЙТ В БАЙТ, код 0** — включая суррогатную пару (`🙂` =
  `360 237 231 202`, то есть пара не разорвана) и обе ПУСТЫЕ печати (на HEAD там
  были `1114100` и `1114112`, на цели — один байт `\n`; контроль П3: `5\n42\n`).
  sha256 образа совпал в таблице, на машине и при сверке; ожидания таблицы —
  ответ МОДЕЛИ, сверенный отдельным скриптом (`.tmp/td62-железо-сверка.ts`,
  8/8). Стенд — `.tmp/td62-hw/`, отчёт — `.tmp/td62-hw/report-hw.txt`, разбор —
  `docs/hardware-debt.md` §3.174.1.


  СДВИГ ЗАКРЕПЛЁННЫХ ЧИСЕЛ (объяснён, не подогнан): отказ на носитель стал ДВУМЯ
  строками ДОПОЛНЯЮЩИХ причин (плановая + прежняя от таблицы операций) — тело
  лексера 69 → 76, у файла целиком 28 → 35, видов 6 → 7, `объединить` 12 (не
  сдвинулось). Отказывающих программ не прибавилось. Сторож D11 переписан на
  ТОЧНЫЕ числа (37 сверены с `#N`, 39 стадийные); пробы K3/K4 в
  `callWindowRefusals` переписаны по факту — стена переехала на
  рантайм-значение.


