notes: >-
  ОТРИЦАТЕЛЬНЫЙ КРАЙ СРЕЗА — ЗАКОННЫЙ СЛУЧАЙ ЯЗЫКА, КОТОРЫЙ ОТКАЗЫВАЛ НА СБОРКЕ
  (2026-11-05, продолжение ATOM-06-02-09).


  ЧТО БЫЛО: `подстрока("абвгде", -2, 6)` давала НАЗВАННЫЙ отказ «края среза
  известны только в рантайме», хотя строка — литерал, а край — константа.
  Причина НЕ в отсутствии механизма (срез по доказанной строке уже считается
  сборкой), а в ТОМ, ЧЕМ ПРИЕЗЖАЕТ КРАЙ. Замер `.tmp/td62-край-минус.ts`
  (носители `shellCarriers`): у `-2` в потоке не литерал, а `IR.sub reg[3] =
  reg[4](0) − reg[5](2)` — арифметика над ДВУМЯ константными регистрами. Пул
  чисел знал только значения, положенные носителем `IR.const`, поэтому
  доказанного края не было, и сборка честно отказывала. Эталон
  (`codePointSlice`) отрицательный край УМЕЕТ (отсчёт от конца: 6 − 2 = 4 →
  «де»), значит отказ был на ЗАКОННОМ случае языка, и это исправлено.


  ЧТО СДЕЛАНО (три файла, только `src/e2k/**`):

  1. `src/e2k/numberFacts.ts` — НОВЫЙ общий модуль: `isNumericCarrier` +
  `foldNumericCarrier` (что значит `IR.add`/`IR.sub`/`IR.mul`, когда оба
  слагаемых известны). Порядок операндов ЗАМЕРЕН (`sub` = первое − второе), а не
  предположен.

  2. `src/e2k/stringPlan.ts` — ветвь свёртки в обходе носителей: приёмник
  УМИРАЕТ (`kill`), число записывается только если ОБА слагаемых доказаны; плюс
  одна точка правды `constantNumber` (её теперь используют и края среза, и —
  через ту же функцию — константный индекс символа; прежний локальный
  `constantEdge` убран как дубль).

  3. `src/e2k/arrayRuntime.ts` — своя inline-свёртка заменена вызовом общей
  функции: два потребителя ОДНОГО вопроса («какое число в регистре») больше не
  могут разойтись в ответе.

  Почему общий модуль, а не копия: две свёртки, разошедшись, ответили бы на одно
  и то же число по-разному — это класс «тихая ложь», а не дублирование кода.


  ИЗМЕРЕНО (модель, оракул `src/e2k/stringSliceStatic.test.ts`, стало 14 проб):
  С1г `(-2, 6)` → «де»; С1г2 `(-4, -2)` → «вг» (свёртка на КАЖДОМ краю, а не на
  первом); С1г4 `(1 + 1, 4)` → «вг» (свёртка не только про минус); С1г3 —
  РАЗЛИЧАЮЩИЙ КОНТРОЛЬ: `-н` при параметре по-прежнему НАЗВАННЫЙ отказ (свёртка
  не имеет права угадывать «минус чего-то unknown»), и отказ называет именно
  КРАЙ. Оракул написан ДО кода и был КРАСНЫМ ровно на трёх пробах
  (С1г/С1г2/С1г4), контроль был зелёным — то есть пробы различают, а не «все
  красные».


  СЛЕПОЕ ПЯТНО ЗАПИСАНО, А НЕ ОСТАВЛЕНО В УМЕ (`BS-0001`): свёртка считает
  числами JavaScript, а у цели арифметика 64-битная — переполнение НЕ
  моделируется. Пока свёртка берётся на константах исходника (индексы, края)
  величины малы, но ничто в коде этого не проверяет; вопрос о стороже ширины
  вынесен владельцу отдельной записью. Предположение НЕ новое (рантайм массивов
  жил с ним с начала), но теперь оно живёт в одном месте и названо.


  ЦЕНА: носители, посчитавшие край, остаются в потоке мёртвыми (сборка кладёт
  готовый блоб и вызов заменяет). Мёртвый код не убирается — это названная цена,
  а не забытая.


  ДВЕ ОШИБКИ ЭТОГО ЗАХОДА, ОБЕ ПОЙМАНЫ ПРОГОНАМИ, А НЕ ГЛАЗОМ (записаны,
  чтобы не повторять):

  1) ПЕРВАЯ РЕДАКЦИЯ СВЁРТКИ СТОЯЛА ВЫШЕ ПО ОБХОДУ, до разбора склейки, и
  `IR.add` с двумя строками умирал в ней: `+` СНОВА начинал складывать АДРЕСА
  (одиннадцатая тихая ложь вернулась). Красными стали `printPrimitivesQemu`,
  `stringConcatRuntime` Ф1–Ф9, `booleanLiterals`, а `loweredGuard`/
  `callWindowRefusals` показали перепись тела 76 → 64. Вывод: свёртка обязана
  стоять ТОЛЬКО там, где уже доказано, что носитель не строковая операция; для
  `IR.add` — ПОСЛЕ проверки `concatLike`. Заодно одна точка правды
  `constantNumber` заменила локальный `constantEdge`.

  2) ОРАКУЛ `src/e2k/stringSymbol.test.ts` держал ДВЕ пробы вида «индекс
  `2 + 3` сборке неизвестен, ответ даёт рантайм (−1)». Это была фиксация
  УСТРОЙСТВА сборки (арифметика не свёртывалась), а не обещание языка: вместе со
  свёрткой такие пробы обязаны брать значение ИЗВНЕ — переписаны на результат
  вызова с ДВУМЯ разными сайтами (значение не доказывается межпроцедурно). Там же
  найдено, что НОВЫЕ пробы были неверны, а не старые: `(и: Число)` не разбирается
  (`и` — логическое И), и отсутствие проверки `беда` прятало это — добавлено
  `expect(итог.беда).toBeUndefined()`.

  ЧТО ИЗМЕНИЛОСЬ ПО ПОВЕДЕНИЮ (названо, а не сглажено): индекс, ВЫЧИСЛЕННЫЙ из
  констант (`0 - 1`), теперь ЗНАКОМ сборке и даёт ТОТ ЖЕ НАЗВАННЫЙ ОТКАЗ, что
  литерал (`индекс -1 вне длины 3`), где прежде уходил в рантайм и цель отвечала
  `−1`. У VM в этом же случае тоже названный отказ (§3.133), поэтому расхождение
  «цель −1 против VM отказ» на этом классе ЗАКРЫТО. Индекс В ГРАНИЦАХ (`1 + 1`)
  работает: код «в» = 1074, через 8-битный канал — 50 (спрошено прогоном).
  Пин `src/e2k/stringSliceStatic.test.ts` стал 14 проб; `stringSymbol.test.ts` —
  16 проб.


  Остаток 06-02 прежний: рантайм-срез (значение или края из рантайма) требует
  ЦИКЛА, то есть носителей `src/e2k/twoPassLayout.ts` — правка VLIW, «стоп и
  доклад»; это `ATOM-06-02-02`.
