notes: >-
  TD-0002 (случай 75). Замер ДО починки (.tmp/td75-зонд.ts, после TD-0001):
  `процедура склейка(а: Строка, б: Строка) / вернуть а + б` при сайтах
  склейка("абв","где") и склейка("аб","вг") — 0 отказов, печать 2228206 и
  2228188 (сумма двух адресов статики). Причина: распознавание склейки шло по
  ДОКАЗАННОМУ ЗНАЧЕНИЮ, а не по объявленному ТИПУ; форма «обе стороны Строка по
  типу, значений нет» не попадала ни в ветвь concatLike, ни в прежний отказ
  «ровно одна сторона известна».


  Решение владельца (развилка): «либо правильный конкат (если TD-0001 работает),
  либо названный отказ; тихая ложь 2228206 — стоп». Выбран НАЗВАННЫЙ ОТКАЗ,
  причина измерена: дескриптор TD-0001 даёт число кодпоинтов (копировать надо
  БАЙТЫ) и не отвечает на вопрос «какая строка пришла»; копирование с
  рантаймовой длиной — цикл, то есть переход, а переходы существуют только как
  носители в src/e2k/twoPassLayout.ts (граница владельца: VLIW/ABI/раскладку не
  трогать).


  Положительная сторона границы проверена ЧИСЛОМ: один сайт (оба значения
  доказаны) — длина (а + б) = 6; две локальные строки = 5; Число + Число = 5 и
  30. Модель = железо 3/3 байт в байт (sha256 сверены до и после).


  Пин «отказов у файла целиком» 28 → 29: единственное место в лексере — строка
  60 lexer.osnova (поток + вид в процедуре с_токеном), установлено решающим
  опытом (.tmp/td75-new/td75-какое-место.ts: замена поток + вид → поток + "|" +
  вид возвращает ровно 28). Тело лексера 68 и построение с AST от тела не
  сдвинулись: там тот же шаг #13 отказывает прежней причиной.


  Оракул: src/e2k/stringConcatRuntime.test.ts (9 проверок, в шлюзе). Замеры:
  полный прогон 241 файл / 3855, шлюз 41 / 392, tsc чист.
