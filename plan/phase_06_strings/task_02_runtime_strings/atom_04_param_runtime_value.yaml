notes: >-
  TD-0001. Границы (владелец, 2026-11-05): только src/e2k/**, VLIW/ABI/раскладку
  не трогать; специализация не нужна (раздувает код); O(n)-проход по байтам
  невыразим — носителей байтовой загрузки нет, а переходы живут только в
  src/e2k/twoPassLayout.ts, куда вход закрыт. Решение: 16-байтный ДЕСКРИПТОР
  (слово 0 — число кодпоинтов, слово 1 — адрес таблицы кодов) непосредственно
  ПЕРЕД статическим блобом значения, читается по «адрес − 16» через ldd;
  ветвлений нет, носителей новых нет, раскладка не меняется (только новое поле
  alignStart у блоба).


  Оракул (владелец): Строка-параметр с двумя РАЗНЫМИ сайтами (ф("абв") и
  ф("где")) — с[0] и длина с работают на ОБОИХ. Модель + железо. Перемерить
  закреплённые числа по факту.


  Факт: модель = железо 5/5, вывод сверен байт в байт (1072/1075; 2/4;
  1073/1077; 1075/1078; −1/−1/1077); 20 проб-контролей отказа остались отказами;
  закреплённые числа не сдвинулись (полный прогон 240/3846, шлюз 40/383).


  Условие механизма: КАЖДЫЙ прямой сайт параметра передаёт литерал пула.
  Ожидание «TD-0001 разблокирует 17 отказов лексера» замером НЕ подтвердилось: у
  сайтов лексера значения собираются в рантайме, блоба (и дескриптора) у них
  нет. Остаток — в реестр долгов отдельной записью (нужен слой ABI: значение
  несёт длину само).
