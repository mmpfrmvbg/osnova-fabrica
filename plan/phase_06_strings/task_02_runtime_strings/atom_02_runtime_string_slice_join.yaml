notes: >-
  ФОРМА ПУТИ B ИЗМЕРЕНА (2026-11-05, ночь, продолжение): НОВЫХ НОСИТЕЛЕЙ ПАМЯТИ НЕ НУЖНО.
  `IR.load`/`IR.store` — ВОСЬМИБАЙТНЫЕ, байтового носителя в дереве нет; НО вводить его значило бы
  тронуть 7 файлов (definitions, формы раскладки, понижение, ЖИВУЧЕСТЬ и СОПОСТАВЛЕНИЕ ПРЕДИКАТОВ,
  `procedureCall`), то есть выйти за границу владельца («только twoPassLayout + таблица форм»).
  Обход найден и он в границах: не-ветвящиеся команды цикла — КОНКРЕТНЫЕ (`ldb`/`stb`/`adds`/`movts`),
  как в `stringArenaCopyInstructions` (их формы раскладка уже берёт `printCommandForm`, и в потоке они
  уже встречаются), а ветви — СУЩЕСТВУЮЩИЕ носители `IR.lt`/`IR.jmp_if_not`/`IR.jmp`. Тогда ни
  `liveness.ts`, ни `predicatePairing.ts` не трогаются вовсе.
  РАЗМЕЩЕНИЕ ЦИКЛА: внутри ОДНОГО носителя цикл невыразим — цели переходов у нас АБСОЛЮТНЫЕ индексы
  потока, их считает `procedureCall.ts#expandCarriers`, а у группы «своих» индексов нет. Поэтому цикл
  копирования — как у коллекций: набор носителей В КОНЦЕ ПОТОКА, сайт кончается `IR.jmp [цикл]`, а сам
  цикл кончается `IR.jmp [продолжение]` по ИСХОДНОМУ индексу носителя ЗА вызовом (чтобы пересчёт сдвинул
  цель вместе с потоком). Все носители цикла раскладке УЖЕ известны, поэтому правок раскладки может не
  потребоваться вовсе — это и есть проверяемая гипотеза следующего шага.


  ОБНОВЛЕНО 2026-11-05 (НОЧЬ, заход 19, §3.178): ЗАМЕР ПЕРЕД КОДОМ СДЕЛАН, И МЕРА БЫЛА ИСПОРЧЕНА.
  Водитель (`tools/e2k-td62-lie/oracle-06-02.test.ts.parked`) краснел 4 из 6, но ДВЕ пробы — Б2 и К1
  — краснели ПО ЛОЖНОЙ ПРИЧИНЕ: процедура в них называлась `взять`, а это ВСТРОЕННОЕ слово v3 (чтение
  массива, 2 аргумента) ⇒ падал ПАРСЕР (`OSN-PAR-001 парсер: «взять» требует 2 аргумента, получено
  0`). После переименования в `сшить` К1 ЗЕЛЁНЫЙ («абвабв» на модели — работа ATOM-06-02-11), Б2 тоже.
  Итог: 4 зелёных, 2 красных. ЛОВУШКА: проба, чьё имя СТАЛО встроенным словом, краснеет по ложной
  причине и выглядит как пробел языка, СКРЫВАЯ уже сделанную работу.
  ОСТАЛОСЬ КРАСНЫМ (С2/С3 — срез по РАНТАЙМУ, оба в ВЫЗЫВАЕМОЙ `резать`): отказ `#1/#3
  система.строка.подстрока: содержимое строки-параметра известно не для всех вызовов (процедура
  «резать») — значение не доказано… срез взять не от чего`, плюс в точке входа `#4 IR.invoke: «…
  подстрока»: у рантайма массивов нет такой операции`.
  ЧТО ИЗМЕРЕНО О МАШИНЕРИИ: выделение у арены принимает размер РЕГИСТРОМ (`arenaSiteCarriers`, ветвь
  `size.kind === 'reg'`), а сайт СКЛЕЙКИ требует байтов ЧИСЛОМ (`arenaConcatSite` — только `imm`) и
  копирует РАЗВЁРТКОЙ (`IR.string_arena_copy`, форма в `twoPassLayout.ts`) ⇒ БЕЗ ЦИКЛА. Строка в
  регистре — адрес байтов, величина длины — в ДЕСКРИПТОРЕ, проход по байтам (таблица продолжений на
  256 байт) есть, но с числом шагов, известным СБОРКЕ. Значит недостающее ровно три: (1) проход
  «кодпоинт → байтовое смещение» с рантаймовым числом шагов, (2) копирование с РАНТАЙМОВЫМ счётчиком
  (цикл), (3) дескриптор результата (иначе `длина` его не прочтёт). ПРЕЦЕДЕНТ цикла в дереве есть:
  цикл копирования коллекций (`collectionsRuntime.ts`) стоит В КОНЦЕ ПОТОКА, входит переходом из сайта,
  выходит переходом на СЛЕДУЮЩИЙ носитель ЗА вызовом по ИСХОДНОМУ индексу (чтобы `expandCarriers`
  сдвинул цель вместе с потоком); внутри группы носителей цикл невыразим — у группы нет своих индексов.
  ПОРЯДОК (решение владельца): СНАЧАЛА ТОЧКА ВХОДА, потом вызываемая — С2/С3 в вызываемой, а строковый
  рантайм живёт в `%b[10..13]` точки входа, в вызываемой эти клетки чужие (§3.138.4).
  ЧИСЛА захода: `npm test` 244 / 3896, `gate:qemu` 44 / 431, `tsc` чист, `docs:check` 161 / 0 ошибок;
  понижение не тронуто, закреплённые числа не могли сдвинуться.


  TD-0003 ИДЁТ ПЕРЕД ЭТИМ АТОМОМ (решение владельца 2026-11-05: «Вариант 3(в).
  Сначала TD-0003, потом 06-02»). Замер этого атома ниже сохранён, чтобы он не
  потерялся.


  ОБНОВЛЕНО 2026-11-05 (ATOM-06-02-09): СТАТИЧЕСКАЯ ПОЛОВИНА СДЕЛАНА И ЖИВЁТ В
  ДЕРЕВЕ. Срез по ДОКАЗАННОЙ строке и КОНСТАНТНЫМ краям больше не отказывает —
  его считает сборка (`src/e2k/stringPlan.ts`, оракул
  `src/e2k/stringSliceStatic.test.ts`, 11 проб). Поэтому ФАКТ 1 прежнего замера
  («`подстрока` понижения не имеет ни на какой глубине») СНЯТ как неверный на
  сегодня: проба K4 в `src/e2k/callWindowRefusals.test.ts` переписана ПО ФАКТУ —
  стена переехала на строку/края из РАНТАЙМА (`K3_РАНТАЙМ`/`K4_РАНТАЙМ`). Заодно
  закрыта двенадцатая тихая ложь — пустая строка печаталась адресом числом
  (`ERR-0003`).


  ЧТО ОСТАЁТСЯ ЭТОМУ АТОМУ (и это ровно прежний ФАКТ 1 в честной редакции):
  срез, у которого значение строки или край известны только В РАНТАЙМЕ. Он
  требует ЦИКЛА копирования с рантаймовой длиной, то есть ПЕРЕХОДОВ, а переходы
  у цели существуют только как носители, которые строит
  `src/e2k/twoPassLayout.ts` — граница, закрытая владельцем (§3.138.4 ставит
  понижение `подстрока` в этом порядке ПОСЛЕДНИМ). Числа на дату этого
  обновления: тело лексера 76 отказов, у файла целиком 35, из них 7 — плановые
  причины среза (`#N система.строка.подстрока: …`). Запакованный водитель
  `tools/e2k-td62-lie/oracle-06-02.test.ts.parked` содержит теперь ТОЛЬКО эти
  пробы (С2/С3/К1); С1 выбыла — она зелёная в дереве.


  Прежний текст замера (сохранён как история):


  ФАКТ 1 (срез): `подстрока` понижения НЕ ИМЕЕТ НИ НА КАКОЙ ГЛУБИНЕ — не «окно
  вызываемой». Доказательство: `src/e2k/callWindowRefusals.test.ts`, проба
  П5/вид K4 (зелёный), плюс `src/e2k/guards/loweredUnchecked.ts:267`. Даже в
  плоскости ТОЧКИ ВХОДА срез сегодня не собирается.


  ФАКТ 2 (склейка): работает ТОЛЬКО на доказанных значениях (случай 75,
  `stringConcatRuntime.test.ts` 9/9); с рантаймовой длиной упирается в арену, а
  в ВЫЗЫВАЕМОЙ отказывает: 43 отказа лексера = 17 «строковая операция в
  вызываемой» + 26 «склейка сверх статического буфера» (§3.138).


  ФАКТ 3: арена принимает размер РЕГИСТРОМ («язык знает его в рантайме»,
  `arenaRuntime.ts:229`).


  СЛЕДСТВИЕ: нужны новые носители + формы в
  `twoPassLayout.ts#carrierFormWithReason` (прецедент — Шаг 1) и цикл O(n) в
  процедуре С ПЕРЕХОДАМИ, где строковых фактов нет (TD-0003). Поэтому 06-02 —
  после TD-0003 и, по решению владельца, разбитый на шаги: сначала точка входа,
  потом вызываемая.


  УТОЧНЕНИЕ ФАКТА 1 (2026-11-05, вечер, после TD-0003): отказ `подстрока` — НЕ
  «понижения нет вовсе», а ДЫРА В ТАБЛИЦЕ ОПЕРАЦИЙ РАНТАЙМА: `OSN-LOW-003, #N
  IR.invoke: «система.строка.подстрока»: у рантайма массивов нет такой
  операции…` (таблица — `src/e2k/arrayRuntime.ts`). Точка расширения ровно одна
  и уже названа.


