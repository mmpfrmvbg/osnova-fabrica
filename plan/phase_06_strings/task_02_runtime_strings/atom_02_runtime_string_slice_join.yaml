  число (длина среза), и это названо, а не спрятано.


  РАЗБОР ДО ПОДКЛЮЧЕНИЯ (2026-11-06, ERR-0006; замер
  .tmp/06-02-разбор-сайта-среза.ts на построителях самого дерева, ничего не
  правилось). Подключение в задуманном виде собрало бы механизм, у которого
  верно только НАБЛЮДАЕМОЕ число. Это не мнение, а пять чисел:


  - АДРЕС ИСТОЧНИКА = БЛОБ + н·8 (три удвоения IR.add); байты строки — сырой
  UTF-8, а ×8 — счёт ТАБЛИЦЫ КОДОВ (STRING_SYMBOL_ENTRY_BYTES). Для
  «abcdefghijkl», н=1, к=4 копируется [8,32) = «ijkl» вместо [1,4) = «bcd».
  Контракт TASK.md §§84/94 задаёт ёмкость блока (к − н) × 4 БАЙТА (worst case
  UTF-8), то есть байтовую семантику.

  - ЗАПИСЬ ЗА БУФЕР: копия длиной 8·(к − н) при буфере 20 байт — при к − н = 3
  запись [0x110ed8, 0x110ef0) при конце буфера 0x110eec, то есть 4 байта за
  буфер (в буфер склейки); отказа нет, цикл сравнивает с БЛОБ + к·8.

  - СЛОТЫ СРЕЗА ЛЕЖАТ ВНУТРИ ПЛОЩАДКИ ПЕЧАТИ ЧИСЛА: куча 0x111000, площадка
  0x110ec0..0x110ee0, дескриптор 0x110ec8, буфер 0x110ed8 — пересечение 24
  байта, дескриптор целиком в площадке, первое слово буфера = слово длины
  печати. Значит `вывести <число>` между срезом и `длина среза` даёт мусор без
  отказа (проверять именно так: срез → печать числа → длина среза).

  - ХВОСТ ЗАМЕЩАЕТ ПОСЛЕДНИЙ НОСИТЕЛЬ: stringSliceGroups ставит группу на индекс
  code.length − 1, expandCarriers подставляет её ВМЕСТО носителя (проба: 5 → 31
  вместо 32, «IR.ret 999» потерян), хотя пункт 2 требует «приписать, как у
  коллекций» — коллекции делают [code[last], ...trailing]
  (collectionsRuntime.ts:1005).

  - ПРИЁМНИК: сторож требует полосу (%b[3] отвергнут, %b[15] пропущен), а
  раскладка селит значения в %b[0..9] — подключение обязано ПЕРЕНЕСТИ результат
  из полосы в приёмник вызова, такого носителя в сборщике нет. Клетки сайта —
  вся полоса: общие с коллекциями %b[8],%b[9], строками %b[10..13], массивами
  %b[10..15], каналом пар %b[8],%b[9] (арена %b[4..6] — единственная без
  пересечения).


  ПОРЯДОК ПРАВОК (решение владельца; до него подключение = тихая ложь, D4/D5):
  (1) байтовый адрес источника и граница копии по концу буфера, (2) слоты среза
  ниже площадки печати (0x110ec0 − 36 с выравниванием), (3) хвост сохраняет
  последний носитель, (4) перенос результата в приёмник вызова, (5) развод с
  прочими рантаймами по клеткам — названным отказом. Только после этого —
  подключение в двух файлах (stringPlan.ts, programImage.ts) плюс sliceReserved
  в loweredUnchecked.ts.
