  ЗАМЕР ПЕРЕД НАЧАЛОМ (2026-11-05, кода не тронуто) — атом НЕ «проводка», а
  постройка рантайм-строк.

  ФАКТ 1 (срез): `подстрока` понижения НЕ ИМЕЕТ НИ НА КАКОЙ ГЛУБИНЕ — не «окно
  вызываемой».

  Доказательство: `src/e2k/callWindowRefusals.test.ts`, проба П5/вид K4
  (зелёный), плюс

  `src/e2k/guards/loweredUnchecked.ts:267`. Даже в плоскости ТОЧКИ ВХОДА срез
  сегодня не собирается.

  ФАКТ 2 (склейка): работает ТОЛЬКО на доказанных значениях (случай 75,
  `stringConcatRuntime.test.ts`

  9/9); с рантаймовой длиной упирается в арену, а в ВЫЗЫВАЕМОЙ отказывает: 43
  отказа лексера = 17

  «строковая операция в вызываемой» + 26 «склейка сверх статического буфера»
  (§3.138).

  ФАКТ 3: арена принимает размер РЕГИСТРОМ («язык знает его в рантайме»,
  `arenaRuntime.ts:229`).

  СЛЕДСТВИЕ: нужны новые носители + формы в
  `twoPassLayout.ts#carrierFormWithReason` (прецедент —

  Шаг 1) и цикл O(n) в процедуре С ПЕРЕХОДАМИ, где строковых фактов нет
  (TD-0003). Поэтому 06-02 —

  после TD-0003 и, по решению владельца, разбитый на шаги: сначала точка входа,
  потом вызываемая.

  Числа закреплённых прогонов на дату замера: `npm test` 242/3866, `gate:qemu`
  42/401.
  ЗАМЕР 2026-11-05 (вечер, ПОСЛЕ TD-0003, кода 06-02 ещё не тронуто) — уточняет ФАКТ 1 и добавляет
  находку.

  УТОЧНЕНИЕ ФАКТА 1: отказ `подстрока` — НЕ «понижения нет вовсе», а ДЫРА В ТАБЛИЦЕ ОПЕРАЦИЙ
  РАНТАЙМА: `OSN-LOW-003, #N IR.invoke: «система.строка.подстрока»: у рантайма массивов нет такой
  операции — он умеет система.массив.создать, .длина, .получить, .добавить, .установить; остальное не
  заменено настоящими обращениями` (таблица — `src/e2k/arrayRuntime.ts`). Отказ стоит на сайте
  `IR.invoke` и назван по имени — это ХОРОШАЯ новость для постройки: точка расширения ровно одна и уже
  названа. Воспроизводится `.tmp/td62-замер.ts` (С1/С2/С3/ОБ1/ОБ2 — отказ везде, шаг 3/4/6).

  НАХОДКА (НОВЫЙ ДОЛГ, `ERR-0002`): `пусть а = три(); пусть б = три(); вывести а + б` при
  `процедура три() → Строка` — **0 отказов** и печать **2228212** (СУММА АДРЕСОВ): та же ложь, что
  случай 75, но стороны — ДОКАЗАННЫЕ результаты вызова. Замер `.tmp/td62-модель.ts`; контроль
  (`"аб" + "вг"`) верен, смешанная форма (`а + "|"`) отказывает по имени. Механизм —
  `.tmp/td62-носители.ts`: кодоген выдаёт `IR.add` + `IR.invoke(3)`, а сторож склейки в плане
  срабатывает лишь когда у стороны НЕТ доказанного значения. План в этом месте не отличает
  `Строка + Строка` от `Число + Число` (тип до клеток-слагаемых не доезжает), поэтому слепой отказ
  запрещён; слои правки (кодоген по объявленному типу либо провоз типа в план) — в `ERR-0002`, выбор
  за владельцем.

  ОРАКУЛ: `.tmp/td62-оракул.test.ts` (водитель: срез по константам, по рантаймовым индексам, по
  рантаймовой строке + склейка рантаймовой длины; границы: ОБ1/ОБ2 и сторож «собралось ⇒ обязано быть
  верно»). В `src/` НЕ переезжает, пока красный: красный файл в `src/` валит `check:test-files`.

