  если байтов источника больше STRING_BUFFER_BYTES (нужна арена — отдельная
  работа).


  2) РАСШИРЕНИЕ (src/e2k/programImage.ts, внутри imageOfCarriers, рядом с
  collectionGroups). Найти носители IR.invoke, у которых операнд 3 — индекс
  имени 'система.строка.подстрока': статические срезы к этому моменту уже
  заменены планом на IR.const, поэтому КАЖДЫЙ оставшийся подстрока-вызов —
  рантайм-срез. Порядок сохраняется раскладкой, поэтому k-й носитель
  соответствует k-й записи плана; расхождение счётчиков — названный отказ
  «дефект конвейера», а не молчаливая подстановка. Операнды носителя ПОСЛЕ
  раскладки: 1 — адрес источника (передан в сайт как from-адрес? НЕТ: операнд 1
  — клетка источника, операнд 2 — начало, операнд 4 — приёмник, операнд 5 —
  конец). Заменить носитель группой stringSliceRuntimeSite (loopIndex = длина
  потока + прирост групп, считается ДО сборки групп), хвост
  stringSliceRuntimeTail (successor = итоговый индекс носителя за группой)
  приписать к группе ПОСЛЕДНЕГО носителя, как у коллекций и арены. Перед сборкой
  — checkStringSliceRuntimeSite/checkStringSliceRuntimeTail; красное = СТОП
  (D24).


  3) ЗАКРЕПЛЕНИЕ. Роли сайта — шесть клеток полосы %b[8..11], %b[14..15] плюс
  ноль/единица %b[12]/%b[13]; если полоса их не держит, объявить список условно
  (образец — collectionReservedRegisters) и довести до regAlloc.reserved.
  Лишнего не закреплять: у программ без рантайм-среза не должно измениться
  ничего (проверка закреплённых чисел полным прогоном).


  ПОТОМ: оракул N=3 и N=11 на РЕАЛЬНОЙ программе (parseV3 → loweredProgram →
  buildElfFromCode → runInQemu; два разных N, чтобы N=0/N=1 не скрыли ошибку),
  затем модель + железо (E8C2, sha256 до/после), затем коммит поведения. Печать
  текста результата у языка пока нечем (TD-0003/TD-0004) — сегодня наблюдаемо
  число (длина среза), и это названо, а не спрятано.


  РАЗБОР ДО ПОДКЛЮЧЕНИЯ (2026-11-06, ERR-0006; замер
  .tmp/06-02-разбор-сайта-среза.ts на построителях самого дерева, ничего не
  правилось). Подключение в задуманном виде собрало бы механизм, у которого
  верно только НАБЛЮДАЕМОЕ число. Это не мнение, а пять чисел:


  - АДРЕС ИСТОЧНИКА = БЛОБ + н·8 (три удвоения IR.add); байты строки — сырой
  UTF-8, а ×8 — счёт ТАБЛИЦЫ КОДОВ (STRING_SYMBOL_ENTRY_BYTES). Для
  «abcdefghijkl», н=1, к=4 копируется [8,32) = «ijkl» вместо [1,4) = «bcd».
  Контракт TASK.md §§84/94 задаёт ёмкость блока (к − н) × 4 БАЙТА (worst case
  UTF-8), то есть байтовую семантику.

  - ЗАПИСЬ ЗА БУФЕР: копия длиной 8·(к − н) при буфере 20 байт — при к − н = 3
  запись [0x110ed8, 0x110ef0) при конце буфера 0x110eec, то есть 4 байта за
  буфер (в буфер склейки); отказа нет, цикл сравнивает с БЛОБ + к·8.

  - СЛОТЫ СРЕЗА ЛЕЖАТ ВНУТРИ ПЛОЩАДКИ ПЕЧАТИ ЧИСЛА: куча 0x111000, площадка
  0x110ec0..0x110ee0, дескриптор 0x110ec8, буфер 0x110ed8 — пересечение 24
  байта, дескриптор целиком в площадке, первое слово буфера = слово длины
  печати. Значит `вывести <число>` между срезом и `длина среза` даёт мусор без
  отказа (проверять именно так: срез → печать числа → длина среза).

  - ХВОСТ ЗАМЕЩАЕТ ПОСЛЕДНИЙ НОСИТЕЛЬ: stringSliceGroups ставит группу на индекс
  code.length − 1, expandCarriers подставляет её ВМЕСТО носителя (проба: 5 → 31
  вместо 32, «IR.ret 999» потерян), хотя пункт 2 требует «приписать, как у
  коллекций» — коллекции делают [code[last], ...trailing]
  (collectionsRuntime.ts:1005).

  - ПРИЁМНИК: сторож требует полосу (%b[3] отвергнут, %b[15] пропущен), а
  раскладка селит значения в %b[0..9] — подключение обязано ПЕРЕНЕСТИ результат
  из полосы в приёмник вызова, такого носителя в сборщике нет. Клетки сайта —
  вся полоса: общие с коллекциями %b[8],%b[9], строками %b[10..13], массивами
  %b[10..15], каналом пар %b[8],%b[9] (арена %b[4..6] — единственная без
  пересечения).


  ПОРЯДОК ПРАВОК (решение владельца; до него подключение = тихая ложь, D4/D5):
  (1) байтовый адрес источника и граница копии по концу буфера, (2) слоты среза
  ниже площадки печати (0x110ec0 − 36 с выравниванием), (3) хвост сохраняет
  последний носитель, (4) перенос результата в приёмник вызова, (5) развод с
  прочими рантаймами по клеткам — названным отказом. Только после этого —
  подключение в двух файлах (stringPlan.ts, programImage.ts) плюс sliceReserved
  в loweredUnchecked.ts.
  ЗАМЕР СЕМАНТИКИ (2026-11-06, заказ владельца «не чини 5 багов — пересмотри
  замысел»; правок в src/ НЕТ; замер .tmp/06-02-семантика-замер.ts на
  построителях дерева + прогон моделью; Питон — независимый свидетель, как в
  §13.6).


  (1) ЕДИНИЦА — КОДОВЫЕ ТОЧКИ, ПРЕДСТАВЛЕНИЕ — БАЙТЫ UTF-8. Канон §13.6
  (длина и индексация — кодпоинты, решение владельца 2026-09-28; строка на цели —
  АДРЕС БАЙТОВ, §3.47/§3.48; длина результата строковой операции обязана быть
  известна СБОРКЕ); схема языка: «Подстрока по диапазону КОДОВЫХ ТОЧЕК (границы не
  рвут суррогатную пару)» (docs/osnova/language-schema.json:2645); §3.133 (таблица
  кодов 8 байт на кодпоинт, чтение ldd, за границей в рантайме −1, константный
  индекс за границей — отказ сборки). Черновик ABI §7/§9 уточняет букву §7:
  «таблица кодпоинтов по 8 байт» — это ОТДЕЛЬНЫЙ блоб таблицы кодов, собираемый на
  СБОРКЕ и только тогда, когда нужен `символ`; в памяти строка лежит БАЙТАМИ
  UTF-8; значение Строки — адрес её байтов, дескриптор [арена][смещение] НЕ
  вводится (docs/abi-v3-draft.md §9:266-276, §10.1:297). «Внутри символа» языком
  НЕ ВЫРАЗИМО: байтового индекса у языка нет вовсе — замер:
  подстрока("ёжзийк",0,1) = «ё» (целый двухбайтовый кодпоинт), длина 1.


  (2) ЧТО ДЕЛАЮТ РАБОТАЮЩИЕ СРЕЗЫ (замер, 13 случаев, модель = Питон 13/13):
  длина "ёжзийк" = 6 (байтов 12), длина "🙂" = 1, длина подстрока("ёжзийк",1,3) =
  2, тексты «жз» / «🙂» / «бвг», а[1] по результату среза = 1074 (код «в»),
  склейка из среза «аб!», края −2/99/3>1 → «йк» / «зийк» / пусто. АРТЕФАКТЫ
  (planStrings): результат среза получает СВОЙ блоб БАЙТОВ результата («бвг», 6
  байт, отдельно от блоба источника «абвгде», 12 байт), а при `с[и]` по нему —
  ещё и СВОЮ таблицу кодов (24 байта = 3×8, коды 1074/1075/1076); длина считается
  рантаймом проходом ПО БАЙТАМ через таблицу продолжений (256 байт в образе,
  53 носителя на 12 байт), то есть длина в КОДОПОИНТАХ, а не готовая константа.
  Ближайший работающий аналог рантаймовой строки — склейка сверх буфера:
  12·2 = 24 байта → арена: длина 12 (кодпоинты), а[0] = 1105, печать работает —
  НО только потому, что сборке известны ОБА слагаемых (длины и байты): арена тут
  от того, что статический буфер мал, а не оттого, что длина неизвестна.


  (3) ТРИ СЕМАНТИКИ, ЗАМЕР. А (края в байтах) — противоречит §13.6/схеме и
  измеренному поведению статики (одна конструкция дала бы два разных поведения,
  D4), и НЕ снимает разбор: длина результата обязана быть в кодпоинтах. Б (буфер
  = кодпоинты по 8 байт, то есть «строка и есть таблица») — это ОТОЗВАННАЯ
  редакция §7 (docs/abi-v3-draft.md:191-195, §9:271-273); замер ёмкости:
  8·(к−н) = 24 байта уже при к−н = 3 против буфера 20 (дефект 2 ERR-0006), а
  полный срез 6-кодпоинтного «ёжзийк» — 48 байт; результат не печатается и не
  склеивается, у него остаётся ОДИН потребитель — слово 0 дескриптора (длина),
  поэтому все пять дефектов через него невидимы. В (кодпоинты; результат — БАЙТЫ
  диапазона; диапазон находит таблица байтовых смещений, собранная СБОРКОЙ и
  читаемая РАНТАЙМОМ) — согласуется с §13.6/§3.133/§7+§9/D2: таблица тут ВХОД, а
  не результат, ровно как таблица кодов для `с[и]` и таблица продолжений для
  длины. Что для В в дереве УЖЕ есть (замер): карта «кодпоинт → байтовое
  смещение» на сборке для известного источника («ёжзийк» → 0,2,4,6,8,10,12 —
  codePointsOfBytes + utf8Bytes), блоб таблицы и её индексация в рантайме
  (8 байт на запись, три удвоения и ldd), цикл копирования БАЙТОВ (8 носителей),
  чтение длины из дескриптора (TD-0001, 6 команд), и арифметика ёмкости: байтовый
  отрезок не длиннее источника, поэтому при источнике ≤ 20 байт копия влезает —
  вот что на самом деле покупает оговорка владельца «источник не длиннее
  STRING_BUFFER_BYTES». Чего НЕТ: таблицы смещений (8 байт на кодпоинт источника;
  при источнике ≤ 255 байт хватило бы и одного байта на кодпоинт) и НОРМАЛИЗАЦИИ
  КРАЁВ В РАНТАЙМЕ — статика делает её на сборке (normal(): отрицательный край от
  конца, обрезка, конец ≤ начало → пусто), а хвост сайта пишет к−н БЕЗ неё (замер:
  IR.sub). Г (то же, но цикл разбирает UTF-8 в рантайме проходом по байтам через
  таблицу продолжений — приём stringLengthInstructions) — это и есть «настоящий
  разбор байтов», который §13.6 называет ДОЛГОМ для строк из памяти; здесь он не
  нужен (источник доказан), и сам цикл в дереве записан как «не знает про
  кодпоинты: проход кодпоинт → байтовое смещение — отдельная работа»
  (src/e2k/stringRuntime.ts:687-688).


  (4) ГДЕ НАСТОЯЩАЯ СТЕНА (то, что решает владелец). Вся строковая экономика
  канона стоит на «длина результата известна СБОРКЕ»; у рантайм-среза её знает
  только цель (§9:275-276 говорит это прямым текстом: «длина результата известна
  только на сборке, и всё, что от неё зависит, для рантайм-значений отказывает»).
  Единственный механизм чтения длины в рантайме — 16-байтовый дескриптор ПЕРЕД
  байтами (TD-0001: length_runtime/symbol_runtime + stringLengthFromDescriptor-
  Instructions): он построен, но ПРОИЗВОДИТЕЛЯ у него нет, а его объявленная
  граница — «дескриптор есть только у БЛОБА, лежащего в СТАТИКЕ; у значения,
  собранного в рантайме (склейка в буфере или в арене), его НЕТ — читать addr−16
  там значило бы читать чужие байты» (src/e2k/stringRuntime.ts:416-421).
  Ближайший аналог — арена — дескриптора НЕ пишет, а её длина известна сборке.
  Значит решение не только «в каких единицах», но и «где результат живёт и откуда
  берётся его длина»: (i) статический буфер + дескриптор, дописанный рантаймом
  (то, что закоммичено) — замерены и пересечение с площадкой печати (24 байта), и
  общие слоты у двух живых сайтов, и противоречие границе «дескриптор только у
  статики»; (ii) АРЕНА: блок [дескриптор 16][байты], размер — рантаймовый
  (арена уже умеет выделять по РЕГИСТРУ размера — arenaRuntime.ts:335, путь
  `система.память.выделить`), результат тогда первый рантайм-собранный носитель
  дескриптора → это РЕШЕНИЕ ПО КОНТРАКТУ (ABI), а не починка; (iii) без
  дескриптора `длина` рантайм-среза отказывает по имени, и у среза не остаётся
  НИ ОДНОГО наблюдаемого (печать рантаймовой строки у языка нечем — TD-0003/
  TD-0004), то есть оракул «число = длина среза» недоказуем (D5).


  ЖДЁТ РЕШЕНИЯ ВЛАДЕЛЬЦА: единица (подтвердить кодпоинты), вариант (Б отозван /
  В таблица / Г разбор), и жильё результата с дескриптором (статический буфер +
  рантаймовый дескриптор ЛИБО арена + расширение контракта дескриптора). После
  решения — ОДНА переделка сайта под семантику, а не пять починок.
