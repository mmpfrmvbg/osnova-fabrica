# ============================================================
# pipeline.yaml — Pipeline DAG for osnova-fabrica
# Version: 0.1.1
# ============================================================
# ВАЖНО: В v0.1 pipeline ЛИНЕЙНЫЙ (хардкод в orchestrator.ts).
# DAG-оркестратор по этой спеке — в v0.2 (DEBT-002).
#
# Целевой язык: Основа (.osnova → .osvbc → VM)
# НЕ TypeScript, НЕ REST, НЕ SQL.
# ============================================================

apiVersion: fabrica/v1
kind: PipelineDAG

metadata:
  name: osnova-pipeline
  version: "0.1.1"
  description: >
    6-фазный pipeline: текст → Intent → OsnovaSpec → .osnova → байткод → golden-check.
    Repair-loop при ошибках компиляции или VM (max 3 итерации).

defaults:
  maxRetries: 3
  retryBackoffMs: [1000, 3000, 10000]
  timeoutMs: 180000
  onTimeout: abort_and_log
  onMaxRetries: log_failure_and_exit

# ─── Единый реестр порогов qualityScore ───────────────────────────────────
# ИСТОЧНИК ПРАВДЫ: src/pipeline/thresholds.ts (QUALITY_PASS, QUALITY_PARTIAL).
# Значения ниже — документация; код читает thresholds.ts. Не дублировать числа.
# Типы BuildReport / GoldenReport — src/pipeline/types.ts
thresholds:
  qualityScore:
    pass: 0.7       # = QUALITY_PASS в thresholds.ts
    partial: 0.5    # = QUALITY_PARTIAL в thresholds.ts (partial_success)
    # partial нужен для сбора трейсов: программа работает, но не идеально.
    # Не является заменой pass — в отчёте ставится статус partial_success,
    # а не success. RuleDistiller в v0.3 использует эти трейсы отдельно.
  repairLoops:
    max: 3

# ─── Посфазная маршрутизация LLM ──────────────────────────────────────────
# ИСТОЧНИК ПРАВДЫ: src/llm/routing.ts (спецификация: docs/llm-routing-v1.md).
# Ниже — ТОЛЬКО декларация: оркестратор v0.1 читает routing.ts, не этот файл.
# Управление: OSNOVA_TIER (auto|flash|pro) × OSNOVA_LEVEL (low|med|high).
llmRouting:
  sourceOfTruth: src/llm/routing.ts
  spec: docs/llm-routing-v1.md
  tiers:
    # auto = Flash по умолчанию + эскалация repair→Pro при застревании.
    auto:  { model: deepseek-flash, escalateRepairToPro: true }
    flash: { model: deepseek-flash, escalateRepairToPro: false }
    pro:   { model: deepseek-pro,   escalateRepairToPro: false }
  # thinking меняет поведение: в thinking-режиме DeepSeek ИГНОРИРУЕТ temperature,
  # а maxTokens удваивается под thinking-токены.
  phases:
    intake:
      model: deepseek-flash
      reasoningEffort: { low: null, med: high, high: max }
      temperature:     { low: 0,    med: null, high: null }
      maxTokens:       { low: 2000, med: 4000, high: 4000 }
    spec_generation:
      model: deepseek-flash
      reasoningEffort: { low: null, med: null, high: high }
      temperature:     { low: 0,    med: 0,    high: null }
      maxTokens:       { low: 4000, med: 4000, high: 8000 }
    codegen:
      model: deepseek-flash
      reasoningEffort: { low: null, med: high, high: max }
      temperature:     { low: 0.2,  med: null, high: null }
      maxTokens:       { low: 8000, med: 16000, high: 16000 }
    repair:
      model: deepseek-flash
      reasoningEffort: { low: null, med: high, high: max }
      temperature:     { low: 0.1,  med: null, high: null }
      maxTokens:       { low: 8000, med: 16000, high: 16000 }
  escalation:
    # Только tier=auto и только фаза repair (build/golden — не LLM).
    thresholdConsecutiveFailures: { low: never, med: 3, high: 1 }
    target: deepseek-pro

phases:

  # ═══ Phase 1: Intake ═══
  - id: intake
    agent: IntakeAgent
    agentMode: intent     # IntakeAgent запускается в режиме intent (см. roles.yaml: modes)
    # Примечание: agentMode — декларативный; оркестратор v0.1 не читает pipeline.yaml,
    # фазы захардкожены в orchestrator.ts (DEBT-002).
    description: Текстовый запрос пользователя → нормализованный OsnovaIntent
    input:
      - type: RawText
        source: cli_arg
    output:
      - type: OsnovaIntent
        fields:
          intentId: uuid
          description: string        # что должна делать программа
          features: string[]         # список поведений ("добавить задачу", "показать список")
          appType: string            # тип приложения (утилита, хранилище, UI-приложение)
          constraints: object        # ограничения (память, платформа)
          confidence: float          # 0..1
    gate: G1_spec_ready
    next: spec_generation
    retry:
      maxAttempts: 2
      on: [llm_timeout, parse_error]
    fallback:
      action: ask_user_to_rephrase

  # ═══ Phase 2: Spec Generation ═══
  - id: spec_generation
    agent: IntakeAgent
    agentMode: spec       # IntakeAgent запускается в режиме spec (см. roles.yaml: modes)
    # agentMode — декларативный; оркестратор v0.1 хардкодит цепочку фаз.
    description: >
      OsnovaIntent → OsnovaSpec.
      Spec описывает модули, типы, процедуры и invoke-вызовы языка Основа.
      НЕТ entities/endpoints/migrations — это не веб-приложение.
    input:
      - type: OsnovaIntent
        from: intake
    output:
      - type: OsnovaSpec
        fields:
          specId: uuid
          modules: OsnovaModule[]    # список .osnova модулей
          mainModule: string         # имя главного модуля (точка входа)
          types: OsnovaType[]        # пользовательские типы
          procedures: string[]       # список процедур с сигнатурами
          syscalls: string[]         # система.хранилище / система.окно / etc
          conventions: object        # имена, стиль кода
    next: codegen
    retry:
      maxAttempts: 3
      on: [llm_timeout, schema_parse_error]

  # ═══ Phase 3: Code Generation ═══
  - id: codegen
    agent: OsnovaCodegen
    description: >
      OsnovaSpec → .osnova исходный код.
      LLM генерирует кириллический код с few-shot примерами из golden-tests.
      Один агент — один главный .osnova файл (в v0.1 нет параллельных групп).
    input:
      - type: OsnovaSpec
        from: spec_generation
      - type: FewShotExamples
        from: golden_store   # примеры из golden-tests.json
        count: 3
    output:
      - type: OsnovaSource
        fields:
          filename: string           # main.osnova
          source: string             # исходный текст на языке Основа
          tokensUsed: int
    next: build
    retry:
      maxAttempts: 2
      on: [llm_timeout, empty_output]

  # ═══ Phase 4: Build ═══
  - id: build
    agent: null     # не LLM — прямой вызов тулчейна
    description: >
      .osnova → лексер → парсер → компилятор → .osvbc байткод.
      Использует src/compiler/ напрямую (compileSource).
      НЕТ tsc, НЕТ npm test — только тулчейн Основа.
      Типы BuildReport строго соответствуют src/pipeline/types.ts.
    input:
      - type: OsnovaSource
        from: last_repair_or_codegen
        # ВАЖНО: оркестратор всегда берёт последнюю версию OsnovaSource —
        # либо из codegen (первый проход), либо из предыдущего repair.
        # Никогда не возвращаться к оригинальному codegen после repair.
    output:
      - type: BuildReport
        # Все поля строго соответствуют src/pipeline/types.ts: BuildReport
        fields:
          success: boolean
          lexerErrors: LexerError[]       # src/pipeline/types.ts: LexerError
          parserErrors: ParserError[]     # src/pipeline/types.ts: ParserError
          compilerErrors: CompilerError[] # src/pipeline/types.ts: CompilerError
          bytecode: OsvbcModule | null    # .osvbc JSON если success
          durationMs: int
    gate: G2_build_pass
    next:
      - condition: success == true
        goto: golden_check
      - condition: success == false
        goto: repair
    retry:
      maxAttempts: 1  # компилятор детерминирован — retry бессмысленен без патча

  # ═══ Phase 5: Golden Check ═══
  - id: golden_check
    agent: null     # прямой вызов VM + сверка
    description: >
      .osvbc → VM исполнение → сверка output с golden-tests.
      Использует OsnovaGoldenRunner из src/runtime/goldenApps.ts.
      НЕТ coverage tool — golden-тесты как proxy качества.
      Типы GoldenReport строго соответствуют src/pipeline/types.ts.
    input:
      - type: BuildReport
        from: build
        condition: success == true
      - type: OsnovaSpec
        from: spec_generation
    output:
      - type: GoldenReport
        # Все поля строго соответствуют src/pipeline/types.ts: GoldenReport
        fields:
          executed: boolean          # VM запустился без краша
          passed: boolean            # output совпал с ожидаемым
          qualityScore: float        # 0..1 (совпадение + полнота)
          vmErrors: VMError[]        # src/pipeline/types.ts: VMError
          outputDiff: string | null  # расхождение с эталоном
          durationMs: int
    gate: G3_golden_pass
    next:
      - condition: passed == true
        goto: done
        runStatus: success

      - condition: passed == false AND vmErrors.length > 0
        goto: repair

      # Диапазон [0.5..0.7): программа работает, но не дотягивает до pass.
      # Статус partial_success: трейс сохраняется для дообучения (RuleDistiller v0.3).
      # Единый источник правды для порогов — thresholds.qualityScore выше.
      - condition: "passed == false AND qualityScore >= 0.5 AND qualityScore < 0.7"
        goto: done
        runStatus: partial_success

  # ═══ Phase 6: Repair (loop) ═══
  - id: repair
    agent: RepairEngineer
    description: >
      Ошибки компиляции или VM → LLM-патч → исправленный .osnova.
      Агент получает ПОСЛЕДНЮЮ версию .osnova (не оригинал из codegen).
      Результат передаётся обратно в build.
    input:
      - type: OsnovaSource
        from: last_repair_or_codegen
        # ПРАВИЛО: оркестратор поддерживает переменную ctx.currentSource.
        # После каждого repair она обновляется на новый OsnovaSource.
        # В build и в следующий repair всегда идёт ctx.currentSource.
        # Никогда не использовать статичный from: codegen в repair-loop.
      - type: BuildReport
        from: build
        optional: true
      - type: GoldenReport
        from: golden_check
        optional: true
    output:
      - type: OsnovaSource    # исправленный .osnova → обновляет ctx.currentSource
    next:
      - build
    maxLoops: 3               # = thresholds.repairLoops.max
    onMaxLoops: log_failure_exit
    loopCounter: repairAttempts
    retry:
      maxAttempts: 2
      on: [llm_timeout]

errorHandlers:
  - trigger: any_phase_timeout
    action: abort_run
    log: timeout_error

  - trigger: repair_loop_exhausted
    action: save_trace_as_failure
    then: exit_with_report

  - trigger: llm_provider_unavailable
    action: retry_with_backoff
    maxRetries: 3
    then: abort_run

telemetry:
  collectPerPhase:
    - duration_ms
    - tokens_used
    - llm_calls_count
    - retry_count
    - error_types
  collectPerRun:
    - total_duration_ms
    - total_tokens
    - repair_loops_count
    - golden_passed
    - run_status           # success | partial_success | failure
    - phases_visited
  exportTo:
    - traces.jsonl   # для дообучения LLM
    - stdout         # CLI-отчёт
