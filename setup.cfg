# Установка без скачивания setuptools в изолированное окружение (при плохой сети к PyPI):
#   pip install -e ".[dev]" --no-build-isolation
# Нужен уже установленный setuptools в текущем env (часто есть вместе с pip).
# Если нет runtime-пакетов (typer, rich, …), их всё равно нужно взять с PyPI или из wheels:
#   pip install -r requirements-cli.txt --no-build-isolation
#   pip install -e . --no-build-isolation --no-deps

[metadata]
name = osnova-cli
version = 5.3.1
description = OSNOVA Forge CLI — управление автономной фабрикой кода

[options]
packages = find:
package_dir =
    = .
python_requires = >=3.11
install_requires =
    typer>=0.12
    rich>=13.7
    pyyaml>=6.0
    python-dotenv>=1.0
    colorama>=0.4.6
    watchdog>=4.0

[options.packages.find]
where = .
include = osnova*

[options.extras_require]
dev =
    pytest>=8
    pytest-mock>=3

[options.entry_points]
console_scripts =
    osnova = osnova.cli:app
