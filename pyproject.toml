# Метаданные пакета — в setup.cfg (+ setup.py). Так pip не тянет setuptools/wheel
# в изолированное build-окружение с PyPI (см. комментарий в setup.cfg).
#
# Установка при плохой сети:
#   pip install -e ".[dev]" --no-build-isolation
# Если typer/rich ещё не стоят — нужны колёса с PyPI или зеркало; см. requirements-cli.txt

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
