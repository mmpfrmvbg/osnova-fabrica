# OSNOVA v5.2 Router Rules (human reference; forge/router.py implements routing)
# Scope lines: "path/to/file.ts — optional note". Only the segment before — is used for *.yaml/*.ts rules
# so prose mentioning pipeline.yaml does not steal routing from real .ts targets.
default_executor: cursor

rules:
  - if: {priority: P0}
    then: {executor: cursor, reason: "self-fix always cursor"}

  - if: {risk: HIGH}
    then: {executor: cursor, reason: "high risk = cursor"}

  - if: {scope_pattern: ".github/*"}
    then: {executor: cursor, reason: "workflows = cursor only"}

  - if: {scope_pattern: "tests/*"}
    then: {executor: qwen, reason: "root tests/ = qwen; src/**/*.test.ts = compiler (see router.py)"}

  - if: {scope_pattern: "*.md"}
    then: {executor: qwen, reason: "docs = qwen"}

  - if: {scope_pattern: "*.yaml"}
    then: {executor: qwen, reason: "config = qwen"}

  - if: {scope_pattern: "*.toml"}
    then: {executor: qwen, reason: "config = qwen"}

  - if: {zone: infra, risk: LOW}
    then: {executor: qwen, reason: "infra + low = qwen"}

  - if: {zone: lang, risk: LOW}
    then: {executor: qwen, reason: "lang + low = qwen"}

  - if: {zone: lang, risk: MEDIUM}
    then: {executor: cursor, reason: "lang + medium = cursor"}

  - if: {executor_unavailable: qwen}
    then: {executor: cursor, reason: "qwen unavailable → cursor fallback"}

  - if: {executor_unavailable: cursor}
    then: {executor: qwen, reason: "cursor unavailable → qwen fallback"}
