# What v4 and v5 add to the E2K operations: hand-written rules, as in
# operations-v3.yaml (which explains the fields). Checked on the
# Elbrus-8C2 (v5); v4 itself (Elbrus-8C, -1C+) is not available here.

header: |
  # Operations added in v4 and v5

  What `elbrus-v5` (the Elbrus-8C2, `geofront.lan`) adds to
  [operations-v3.md](operations-v3.md): 741 operations, 738 of them new
  in v5 and three (`fscaled`, `fscales`, `fxscalesx`) in v4, which has
  no machine here and was checked on the 8C2. 512 of the 741 are the 256
  truth tables of `plog` and `qplog`, so about 230 operations are really
  new. **Generated** by `tools/isa-extract/gen_operations.py` from
  `operations-v5.yaml`; the columns are those of operations-v3.md, and
  "lcc v3 / v5" shows that lcc's v5 sysroot uses 35 of them.

  Every v5 ALU operation was run on the 8C2 by `sem5.c` (40 sets of
  128-bit inputs) and gives the same 128 bits as the community qemu, so
  its helpers (`OpenE2K/qemu-e2k-community/target/e2k/helper_*.c`)
  describe what the rows summarise; semantics.md, "v5 operations",
  lists where MCST's qemu differs.

  ## What v5 changes for a compiler

  Beyond the new operations (each item has its details in the page
  named):

  - **128-bit registers.** Every register's extended part is 64 bits,
    so a register holds a 128-bit packed value (`%qprN`), operated on as
    a whole by the `qp*` operations; 64-bit operations read its low half
    (spec/abi/registers.md). A 64-bit FP-side result read by a `qp`
    operation pays the cluster-crossing cost even in the same channel
    (timing.md, "Elbrus-8C2").
  - **Six FP operations a cycle**: `fadd`, `fmul`, `fmul_add` and the
    packed FP add, subtract and multiply operations (`qpfaddd`,
    `qpfmuld`, the horizontal and combined forms such as `qpfmul_addd`)
    also issue in ALC2 and ALC5 (timing.md); packed FP compares, min/max
    and conversions stay in ALC0, 1, 3 and 4.
  - **Memory**: `ldqp` is served by L2 (11 cycles, one a cycle), so lcc
    loads 128-bit data as two `ldd` + `qppackdl`, or with `movaqp` from
    the array prefetch buffer; `ldq` (a register pair) goes through L1.
    16-byte atomics are inline `ldqp`/`stqp` with the lock MAS
    (atomics.md). A store and a load in one 32-byte block in one
    instruction always take about 2 cycles (timing.md).
  - **Array prefetch and loops**: `%aaind`/`%aaincr` are 64-bit, a
    misaligned area gives data instead of a diagnostic value, `movaqp`
    reads 16 bytes and an area delivers 16 bytes a cycle (apb.md);
    `%lsr1` holds the 64-bit loop count (loops.md); the data speculation
    table keeps quad entries (speculation.md).
  - **Changed behaviour of v3 operations**: `getf` takes the sign bit
    from the field's top instead of the descriptor's BYTE field, which
    becomes `getfz`'s low-zero count (semantics.md, "Field extract");
    `pshufb` applies mask bits 4–6 (invert, bit-reverse, sign) that v3
    ignores (semantics.md, "Packed operations of v3"); `sdivd` every 2
    cycles no longer conflicts in the divider.
  - **Integer or packed results**: `getfz*` and `addcd`/`subcd` are
    integer operations (1 cycle to any consumer in their cluster, 2 to
    an integer one in the other). `plog`, `qplog`, `psrcd`, `qppackdl`
    and `qpswitchd` give packed results, as v3's `pandd` does: 1 cycle
    to packed and FP operations and to store data in their cluster (3
    from the other), 4 to integer operations and load addresses
    (measured for `plog`; for `qplog`, `psrcd`, `qppackdl` and
    `qpswitchd` only to `addd` and to store data in their cluster,
    `qplog` also to `plog`, the rest inferred: timing.md,
    "Elbrus-8C2").
  - **Unchanged**: the ABI, and every v3 latency, hazard and control
    delay (timing.md, "Elbrus-8C2") but two: `pfdivd` and `pfsqrttd`
    take 2 cycles more, and an FP operation's result reaches the single
    or double operand of an 80-bit operation 2 cycles later.

  ## How lcc uses them

  In its v5 sysroot libraries (`lcc-usage.yaml`, disassembled):

  - **16-byte moves**: `qppackdl` (9,060 times) builds a 128-bit value
    from two `ldd` results and `stqp` (6,490) stores it: structure and
    block copies. `qpswitchd` (3,639) swaps the halves, mostly around
    `__float128` code.
  - **String functions** (`strlen`, `strnlen`, `strcat`, `rawmemchr`,
    …) test 16 bytes at a time: `qpcmpeqb` against zero, `qpsgn2mskb`
    to a 16-bit mask tested in a scalar register, `qpminub`/`qpor` to
    combine blocks; `stmqp` writes the tail of `strcpy`-like functions.
  - **`memcpy`/`memmove`**: aligned `ldqp` from the source, `qppermb`
    with a byte-shift mask to realign two neighbouring 16-byte chunks,
    aligned `stqp` (some with `mas = 0x60`, a cache hint), and for long
    copies a `loop_mode` loop storing with `staaqp`.
  - **`strcasecmp`**: two `qpcmpgtb` range tests and `qpand` find the
    upper-case bytes, `qplog_0xf8` (a | (b & c)) ORs in 0x20 there.
  - **Multi-precision arithmetic** (`__mpn_add_n`, `__mpn_mul_1`,
    `strtod`): `addcd`/`addcd_c` and `subcd`/`subcd_c` chain the carry.
  - **Scaled indexes**: `getfzd`/`getfzs` (1,192 times, among them
    libc's `_des_crypt` 384, `__strncasecmp_nonascii` 98 and
    `__strcasecmp_nonascii` 68, libcrypt's DES 500) for a field shifted
    left by 1–7 bits, mostly an index scaled to its element size
    (semantics.md, "Field extract").
  - **libm**: `fscaled`, `fscales`, `fxscalesx` implement `ldexp`,
    `scalbn` and friends.

  Its code generator is more conservative: at `-O3` the loops tried
  (`tools/isa-probes` aside: integer, float and double array arithmetic,
  saturating byte adds, `short` min and dot products, rotates, selects,
  logic, shifts, multiplies, conversions) mostly keep the 64-bit packed
  operations of v3 with 64-bit `mova`, adding `pmullw` for 32-bit
  multiplies and `psrcw` for rotates. 128-bit operations, with
  `movaqp`/`staaqp`, appear in byte loops (`qpaddusb`, `qpor`, `qpxor`,
  `qpsubb`, `qpcmpgtb`, `qppermb`; byte multiplies and shifts with
  `qpmullh`, `qpmulhh`, `qpsllh`, `qpand`, `qplog`), in FP selects and
  counts (`qpfcmplts`, `qpfcmpltd` + `qpmerge`) and as `qpfmuld` +
  `qpfaddd` for `a = b × c + a` on doubles. **`-faligned`** (lcc's
  `--help`: allow optimizations that rely on aligned memory accesses
  only) moves the other loops to 128 bits as well: they then use
  `movaqp`/`staaqp` with `qpand`, `qpandn`, `qplog`, `qpxor`,
  `qpmullh`, `qpmullw`, `qpsll*`, `qpsrl*`, `qpsra*`, `qpsrcw`,
  `qpsrcd`, `qpfmax*`, `qpfmin*`, `qpfcmp*` + `qpmerge` for masks, and
  the same-width conversions (`qpistofs`, `qpfstoistr`, `qpidtofd`,
  `qpfdtoidtr`, `qpfdtoid`). `-ffast` turns `-faligned` on: in these
  loops `-ffast` gives the `-faligned` code and `-ffast -fno-aligned`
  the plain `-O3` code byte for byte (elsewhere `-ffast` does more: it
  drops `sqrt`'s `errno` path and inlines `sqrtl`). Even with
  `-faligned`, `!=`, unordered and `isless` compares, width-changing
  conversions, `floor` and friends, high-half multiplies, sums of
  absolute differences, per-lane shift counts and `long` arithmetic
  right shifts stay scalar, and `short` dot products keep the 64-bit
  `pmaddh`. `__int128` addition stays scalar (no `addcd`), and a
  16-byte `memcpy` of unknown alignment is `qppackdl`, `qpswitchd` and
  sixteen `stb`, also between `double *` (two `std` with `-faligned`).

  Loops over arrays whose alignment lcc knows go to 128 bits at `-O3`
  too: NPB SP's arrays are global, and its `compute_rhs`, `lhsx`,
  `lhsy`, `lhsz`, `txinvr`, `ninvr`, `pinvr` and solvers (`x_solve` …)
  read through `movaqp` and store with `staaqp` around `qpfmul_subd`,
  `qpfmul_addd`, `qpfaddd` and `qpfmuld` [lcc 1.29.16 `-O3`, NPB SP
  class A]. A stream of unknown alignment is read with `movaqp` as
  well and its results stored as two `staad` (apb.md, "128-bit movas
  (v5+)").

  Straight-line code is another matter: at `-O3` (and `-O4`) lcc pairs
  small groups of like operations on neighbouring data into 128-bit
  operations [lcc 1.29.16 and 1.31.05 for v5.8c2 and v6.2c3:
  `tools/isa-probes/foldp93_slp.c`, read with `-S`]. Two doubles of a
  structure through `restrict` pointers (`r->x = a->x + b->x; r->y =
  a->y + b->y`) become two `ldd` each, `qppackdl`, one `qpfaddd`, then
  `qpswitchd` and two `std` (v6: one `ldqp` an operand, the same
  stores); two longs, four ints and sixteen bytes written out likewise
  (`qpaddd`, `qpaddw`, `qpaddb`), and eight floats of an unrolled loop
  as two `qpfadds` (sixteen byte adds as a loop stay two 64-bit
  `paddb`), stored with `stqp` where the destination is a
  16-byte-aligned global array (through a pointer to a 16-byte-aligned
  type only under `-faligned`); five doubles scaled by one value are
  two `qpfmuld` and an `fmuld`, and two multiply-adds `qpfmuld` +
  `qpfaddd`, not `qpfmul_addd`. It pairs nothing through pointers that
  may alias, nor the lanes of a complex multiply, and leaves products
  of small matrices scalar: unrolled 4×4 and 5×5 products stay `fmuld`
  with `faddd`/`fsubd` (on v5 partly fused into `fmul_addd`/
  `fmul_subd`), only their results packed (`qppackdl` + `stqp`) where
  they go to aligned global arrays. NPB BT's 5×5 block routines
  (`matmul_sub`, `binvcrhs`, `binvrhs`) and LU's `jacld`, `blts` and
  `buts` have no 128-bit operation at all [lcc 1.29.16 `-O3`, NPB
  class A].

  ## What v3 code does instead

  | v5 | v3 equivalent |
  |---|---|
  | a `qp` lane operation | the 64-bit `p` operation twice |
  | `qppackdl`, `qpswitchd` | nothing (a register pair `%qrN` is two registers) |
  | `getfz` | `getf` then `andd` (or a shift) |
  | `addcd`/`subcd` with `_c` | add, an unsigned compare for the carry, a predicated add |
  | `plog`/`qplog` | up to three logic operations (`andn`, `orn`, `xorn` help) |
  | `qppermb` | per 8-byte half of the result, two `pshufb` and a `pmerge` |
  | `qpsgn2mskb` | `pmovmskb hi, lo` on the two halves (one operation) |
  | `pmullw` | two `muls` and repacking |
  | `psrcw`, `psrcd` | `psll*` + `psrl*` + `por` |
  | `stmqp` | byte stores, or load, `pmerge` and store (when the bytes outside may be rewritten) |
  | `ldqp`/`stqp` | two `ldd`/`std` (`ldq`/`stq` pair forms are v5 too) |
  | `fscale*` (v4) | a library call (`ldexp`) |

groups:

- title: Scalar operations
  rules:
  - ops: addcd subcd addcd_c subcd_c
    does: "64-bit add or subtract with carry or borrow in from c bit 0: `addcd` gives the sum, `addcd_c` the carry out (0 or 1), `subcd` and `subcd_c` likewise (community qemu `tcg_gen_add2`). ALC1/4. An integer result: 1 cycle to any consumer in its cluster, 2 to an integer operation in the other (timing.md, \"Elbrus-8C2\")."
    use: "Multi-word arithmetic: `__int128`, `addti3`/`subti3`, `uaddv`, bignums (lcc: `__mpn_*`)."
    see: semantics.md, "v5 operations"
  - ops: getfz{s,d}
    does: "`getf` (v5 sign rule), then clear the result's low BYTE bits (descriptor bits 13–15): a contiguous mask with up to 7 low zeros in one operation."
    use: "`(x >> k) & m` and `x & m` for contiguous masks with 1–7 low zeros (0xff0, 0xfff0). lcc uses it mostly for a field shifted left by 1–7 bits afterwards (a scaled array index, a field moved up, a bit-field shifted left), not for a mask written with its zeros (lcc: `_des_crypt`, `strcasecmp_nonascii`, libcrypt's DES; Lua's `luaV_execute` 174). An integer result, as `getfd`: 1 cycle to anything in its cluster, 2 to an integer operation in the other (timing.md, \"Elbrus-8C2\")."
    see: semantics.md, "Field extract"
  - ops: fscale{s,d}
    does: "a × 2^b, b a signed 32-bit integer, rounded once with IEEE flags. v4+; ALC1/4."
    use: "`ldexp<mode>3` with `-fno-math-errno` (lcc's libm: `ldexpf`, `scalbnf`, `__kernel_rem_pio2`). lcc inlines `scalbnf` as `fscales` at `-O2` and up, but keeps `ldexp`, `ldexpf` and `scalbn` calls even with `-ffast`."
    see: semantics.md, "Other scalar operations"
  - ops: fxscalesx
    does: "80-bit a × 2^b (b a 32-bit integer), **rounded to the precision control** unlike x87 `fscale`. v4+."
    use: "`ldexpl`, `scalbnl`."
    see: semantics.md, "80-bit operations"

- title: 64-bit packed additions
  rules:
  - ops: pmullw
    does: Two 32-bit lanes, low 32 bits of each product (x86 `pmulld` on 64 bits).
    use: "`mulv2si3`; lcc's v5 vectorizer uses it for `int` multiplies."
  - ops: psrcw psrcd
    does: Rotate every 32-bit (`w`) or 64-bit (`d`) lane right by the count b.
    use: "`rotrv2si3`; lcc vectorizes `(x >> k) | (x << (32 − k))` with it."
  - match: 'plog_0x[0-9a-f]{2}'
    does: "Any three-input bitwise function of a, b, c: result bit = bit ((a << 2) | (b << 1) | c) of the table in the name (`0x80` a & b & c, `0x96` a ^ b ^ c, `0xf8` a | (b & c), `0xca` a ? b : c, `0xe8` majority). A packed result: 1 cycle to another `plog`, a packed or FP operation or store data in its cluster; 4 to an integer operation, a compare or a load address, and to a `plog` in the other cluster; 3 to store data in the other cluster (timing.md, \"Elbrus-8C2\")."
    use: "Any expression of three operands' bits in one operation (`ternlog`) whose result goes to packed or FP operations, more `plog`s or memory: selects, majority, a | (b & c), copysign. In integer code it saves one or two operations but costs 4 cycles where two or three logic operations cost 2–3. lcc 1.29.16 keeps scalar majority, select and three-way xor as `andd`/`andnd`/`ord`/`xord`; its v5 libraries' 8 are `plog_0xea` (c | (a & b)) copysigns feeding `fmuld` in libgcc's `__divdc3`, and lcc 1.31.05 chains `plog_0xa8` and `plog_0xea` into the stores of a vectorized loop's 64-bit part (`tools/isa-probes/foldisa_getfz.c`)."

- title: 128-bit integer operations
  intro: >
    Lane-wise unless noted, with twice the lanes of the 64-bit operation
    of the same name without `q` (operations-v3.md). 1 cycle (multiplies
    and SAD 2), fully pipelined in every channel the ALC column gives.
  rules:
  - ops: qpadd{b,h,w,d} qpsub{b,h,w,d} qpadds{b,h} qpaddus{b,h} qpsubs{b,h} qpsubus{b,h}
    does: Add or subtract, wrapping or saturating.
    use: "`add`, `sub`, `ssadd`, `usadd`, … on `V16QI`, `V8HI`, `V4SI`, `V2DI`."
  - ops: qpmax{s,u}{b,h,w} qpmin{s,u}{b,h,w} qpavgus{b,h}
    does: Maximum, minimum, rounding average (x86 `pmax*`, `pmin*`, `pavg*`).
    use: "`smax`, `umin`, `uavg*_ceil`; lcc's `strlen` merges blocks with `qpminub`."
  - ops: qpcmpeq{b,h,w,d} qpcmpgt{b,h,w,d}
    does: All-ones lanes where a = b, or a > b signed.
    use: "`vec_cmp`; byte search (`qpcmpeqb` then `qpsgn2mskb`)."
  - ops: qpmullh qpmulhh qpmulhuh qpmulhrsh qpmullw qpmaddh qpmaddubsh qpsign{b,h,w}
    does: "Multiplies (low, high signed or unsigned, rounded high, 32-bit low), `pmaddwd`-style and signed × unsigned byte dot steps, `psign`."
    use: "`mulv8hi3` `qpmullh`, `mulv4si3` `qpmullw`, `smulv8hi3_highpart` `qpmulhh`, `umulv8hi3_highpart` `qpmulhuh`, `smulhrsv8hi3` `qpmulhrsh`, `sdot_prodv4siv8hi` `qpmaddh` + `qpaddw`, `abs` as `qpsign* a, a`; `qpmaddubsh` saturates its pair sums to 16 bits, so it is no exact `usdot_prod`. lcc's vectorizer uses only `qpmullh` and `qpmullw` (under `-faligned`; a `V16QI` multiply is `qpmullh` + `qpmulhh` with `qpand` masks and a `qppermb` merge, also at `-O3`); its high-half and dot-product loops stay scalar or use the 64-bit `pmaddh`. Its x86 headers map `_mm_mulhi_epi16`, `_mm_mulhi_epu16`, `_mm_mulhrs_epi16`, `_mm_madd_epi16`, `_mm_maddubs_epi16` (operands swapped) and `_mm_sign_epi8` one to one. Its v5 libraries: `qpmullw` 95 (libgfortran's `matmul_i4`)."
  - ops: qphadd{h,w} qphaddsh qphsub{h,w} qphsubsh
    does: Horizontal pairs over 128 bits, a's pairs into the low half, b's into the high half.
  - ops: qpsadbw qpmpsadbh qpmulubhh
    does: "`psadbw` per 64-bit half; `mpsadbh` per half with the same 32-bit b; `qpmulubhh`: `pmulubhh` per half, bytes 0–3 of the 64-bit a for the low half and 4–7 for the high half."
    use: "`usadv16qi` (one sum per 64-bit half, as x86 `psadbw`) and, against zero, the byte sums of each half (inferred); `qpmpsadbh` is x86 `mpsadbw` (lcc's `_mm_mpsadbw_epu8`: `qppermb`, then `qpmpsadbh`); `qpmulubhh` has no C idiom. lcc emits no `qpsadbw`: its SAD and byte-sum loops stay scalar even with `-ffast`, its `_mm_sad_epu8` is two 64-bit `psadbw` on v5 too, and its libraries have none."
  - ops: qpand qpandn qpor qpxor
    does: 128-bit and, a & ~b, or, xor.
    use: "`and`, `ior`, `xor<mode>3` on 128-bit modes, `one_cmpl` as `qpxor` with all ones, `(and (not b) a)` as `qpandn a, b` (so `~a & b`, x86 `andnot (a, b)`, is `qpandn b, a`). lcc's v5 libraries: `qpor` 425 (string functions merging 16-byte blocks: `strlen`, `strcat`, `strncpy`, `memccpy`), `qpand` 45 (`strcasecmp`, libatomic's 16-byte routines); its vectorizer uses all four under `-faligned` (`qpor`, `qpxor` in byte loops at `-O3` too), and for GNU vector `a & ~b` and `~a` lcc 1.29 works on the 64-bit halves with `xornd`."
  - match: 'qplog_0x[0-9a-f]{2}'
    does: "`plog` on 128 bits (the table in the name). lcc's `strcasecmp` folds case with `qplog_0xf8` = a | (b & c). Packed, as `plog`: 4 cycles to an `addd` reading its low half."
  - ops: qpsll{h,w,d} qpsrl{h,w,d} qpsra{h,w} qpsrc{w,d}
    does: "Every lane shifted (or rotated: `qpsrc`) by the 64-bit count b; counts ≥ the lane width give 0 (the sign for `qpsra*`). MCST's qemu takes `qpslld`/`qpsrld` counts modulo 64; the hardware doesn't."
    use: "`ashl`, `lshr`, `ashr<mode>3` with one count for all lanes in a 64-bit register (`V8HI`, `V4SI`; `V2DI` for the logical ones), `rotr` `qpsrcw`, `qpsrcd`. lcc's vectorizer emits them under `-faligned` (rotates included) for a constant or loop-invariant count, and `qpsllh` with a byte mask (`qpand`, `qplog`) for `V16QI`; `V2DI` arithmetic shifts (no `qpsrad` before v6) and per-lane counts (`vashl`) have no operation, and lcc keeps them scalar. Mask a count held in a vector register to the lane, as for the 64-bit shifts (doc/gcc-port-plan.md, D10). Its v5 libraries: 48 (`_ufc_setup_salt_r`)."
    see: semantics.md, "v5 operations"
  - ops: qpacksshb qpackushb qpacksswh qpackuswh
    does: "Narrow with saturation: a's lanes into the high 64 bits, b's into the low 64."
    use: "`vec_pack_ssat`, `vec_pack_usat` (operands swapped)."
  - ops: qpshufb
    does: "Low 64 bits of the result = `pshufb` (b.high, b.low, c.low), high = `pshufb` (a.high, a.low, c.high), with v5's byte rules."
    use: "One-source `vec_perm` on `V16QI`: `qpshufb x, x, m` takes each result byte from any of x's 16 bytes, with m `qpand`ed with 0x0f0f… (GCC's selector is taken modulo 16; bit 7 would give a constant and bits 4–6 invert, reverse or sign-replicate the byte); with m `qpand`ed with 0x8f8f… it is x86 `pshufb` (lcc's `_mm_shuffle_epi8`). Two-source permutes and lcc's own (byte reversal, at `-O3`) use `qppermb`; its libraries have no `qpshufb`."
  - ops: qppermb
    does: "Byte i: c's byte selects byte (bits 0–3) of a (bit 4 set) or b, then optionally inverts it (bit 5), reverses its bits (bit 6) or replicates its sign (bit 7)."
    use: "`vec_perm` on 128 bits; realigning two 16-byte chunks (lcc's `memcpy`)."
  - ops: qpmerge
    does: "Byte i = c's byte negative ? b's : a's."
    use: "`vcond`, `vec_merge` with a byte mask."
  - ops: qppackdl qpswitchd qpswitchw
    does: "`qppackdl a, b` makes a 128-bit value with a high, b low; `qpswitchd` swaps the halves, `qpswitchw` the 32-bit words within each half."
    use: "Building 128-bit values from 64-bit ones (lcc: two `ldd` + `qppackdl` instead of `ldqp`)."
  - ops: qpsgn2mskb qpmsk2sgnb
    does: "`qpsgn2mskb b`: the 16 byte sign bits as a 16-bit mask; `qpmsk2sgnb a, b`: a with each byte's sign bit set from mask bit i."
    use: "`vec_extract_msb`-style mask tests (lcc's string functions)."
  - ops: qphminposuh
    does: Minimum unsigned halfword of 16 lanes (a's lanes first) and its index (bits 16 up), into a 64-bit register. 4 cycles.

- title: 128-bit FP and conversions
  intro: >
    4 singles or 2 doubles per register, IEEE with flags as the scalar
    operations (packed compares quiet for eq, neq, od, uod); 4 cycles,
    in all six channels for `qpfmul_add*` and ALC0, 1, 3, 4 otherwise.
  rules:
  - ops: qpfadd{s,d} qpfsub{s,d} qpfmul{s,d} qpfmax{s,d} qpfmin{s,d} qpfhadds qpfhsubs qpfaddsub{s,d}
    does: "Lane-wise arithmetic; x86-style max/min (2 cycles); `addsub` subtracts in even lanes and adds in odd."
    use: "`V4SF`, `V2DF` patterns (lcc: `qpfmuld` + `qpfaddd`)."
  - ops: qpfcmp{eq,lt,le,uod,neq,nlt,nle,od}{s,d}
    does: All-ones lanes where the compare holds; eq, neq, od, uod quiet (MCST's and the community qemu both raise invalid wrongly).
    use: "`vec_cmpv4sfv4si`, `vec_cmpv2dfv2di` and `vcond_mask` with `qpmerge`, as `pfcmp*` (operations-v3.md): lt, le, eq directly, gt, ge with the operands swapped, `!(a < b)` by swapping the `qpmerge` arms, `!=` `qpfcmpneq*`, unordered `qpfcmpuod*`; `qpfcmplts a, b, m` then `qpmerge y, x, m` (2 cycles apart). lcc's v5 vectorizer does this for selects and counts at `-O3` and for masks too under `-faligned`, and keeps `!=`, unordered and `isless` loops scalar; GNU vector `!=` is `qpfcmpneqs`, and its `_mm_cmpnlt_ps`, `_mm_cmpunord_ps`, `_mm_cmpord_ps` are `qpfcmpnlts`, `qpfcmpuods`, `qpfcmpods`."
  - match: 'qpf(add|sub|mul|hadd|hsub|addsub)_(add|sub|rsub|hadd|hsub|addsub)[sd]'
    does: "Combined: Y(c, X(a, b)) lane by lane, two roundings, 8 cycles; `qpfmul_add*` in all six channels."
    use: "Multiply-add under `-ffp-contract=fast` (not `fma()`)."
    see: semantics.md, "FP min, max and combined operations"
  - ops: qpidtof{s,d} qpistof{s,d} qpfdtoi{d,s,dtr,str} qpfstoi{d,s,dtr,str} qpfstofd qpfdtofs
    lat: "4 (v5)"
    does: "Conversions between 32/64-bit integers, singles and doubles (widening ones read 64 bits, narrowing ones write 64). 4 cycles to a consumer of their format."
    use: "Same lane width: `floatv4siv4sf2` `qpistofs`, `fix_truncv4sfv4si2` `qpfstoistr`, `lrintv4sfv4si2` `qpfstois`, `floatv2div2df2` `qpidtofd`, `fix_truncv2dfv2di2` `qpfdtoidtr`, `lrintv2dfv2di2` `qpfdtoid` (lcc's vectorizer uses all but `qpfstois`, under `-faligned`). Widening from a 64-bit register (two lanes to two doubles or longs) and narrowing into one are the halves of the unpack and pack patterns, the other half taken with `qpswitchd` or joined with `qppackdl` (inferred): `qpfstofd` `vec_unpacks_lo/hi` (`V4SF`), `qpistofd` `vec_unpacks_float_lo/hi` (`V4SI`), `qpfstoidtr` `vec_unpack_sfix_trunc_lo/hi` (`V4SF`), `qpfdtofs` `vec_pack_trunc` (`V2DF`), `qpidtofs` `vec_packs_float` (`V2DI`), `qpfdtoistr` `vec_pack_sfix_trunc` (`V2DF`); `qpfstoid`, `qpfdtois` round in the current mode (lrint). lcc emits these for `__builtin_convertvector` and its `_mm_cvt*` headers but keeps such loops scalar, and converts unsigned lanes one by one."
    see: timing.md, "Formats"
  - ops: qpfdtoifd qpfstoifs
    does: Round every lane to integral, a giving the mode as x86 `roundpd`'s immediate (bit 3 suppresses inexact; MCST's qemu ignores it).
    use: "`floor`, `ceil`, `btrunc`, `rint`, `nearbyint<mode>2` on `V4SF`, `V2DF` with a = 1, 2, 3, 4, 0xc, the values lcc gives scalar `fstoifs`/`fdtoifd` (so its floor, ceil and trunc raise inexact; 9, 0xa, 0xb would not); `roundeven` 8 (inferred). lcc's vectorizer keeps these loops scalar even with `-ffast`; its `_mm_floor_ps`, `_mm_ceil_pd`, `_mm_round_ps` headers pass the x86 immediate (`qpfstoifs 0x1`, `qpfdtoifd 0x2`, `qpfstoifs 0x8`). C `round` has no mode: lcc truncates (3) and corrects."

- title: Memory
  intro: >
    New 16-byte accesses. `ldqp` goes to L2 (11 cycles); `ldq`, a
    register pair, through L1 (3).
  rules:
  - ops: ldq stq
    does: Load or store a register pair (16 bytes at a + b, the low register at the lower address).
    use: "`movti` (and other 16-byte modes kept in a register pair `%qrN`) to and from memory in one operation instead of two `ldd`/`std`, at any address (off a multiple of 8, about 4 times slower for `ldq` and 7 for `stq` on the 8C2, no slower on v6: semantics.md, \"Memory, tag and descriptor operations\"); `ldq` takes two load channels (ALC0+2 or 3+5), `stq` both store channels, so they free no channels. lcc never emits them: `__int128`, 16-byte struct, `_Complex double` and `__float128` copies are two `ldd`/`std` on v5 and, when 16-byte aligned, `ldqp`/`stqp` on v6."
  - ops: ldqp stqp
    does: "128-bit load/store of a `%qpr` register; with the lock and unlock MAS the inline 16-byte atomics (v3 code calls libatomic)."
    use: "Block copies and 16-byte atomics; lcc's `memcpy` combines aligned `ldqp` with `qppermb`."
    see: atomics.md; timing.md, "Elbrus-8C2"
  - ops: stmqp
    does: "Masked 128-bit store: byte i written when bit i of b's low 16 bits is set; address a alone; SIGBUS unless 16-byte aligned."
    use: "String and vector tails at aligned addresses (lcc: `strcpy`, `strncat`, `memccpy`)."
    see: semantics.md, "Memory, tag and descriptor operations"
  - ops: ldaaqp staaqp
    does: "128-bit AAU access through `%aadN` + `%aastiN`; `staaqp` counts as one store for loop-mode store suppression. Both need 16-byte alignment on v5 (SIGBUS), none on v6. `ldaaqp` is an AAU load (served from L2); with `,sm` and MAS mod 4 or 7 it gives a diagnostic value for every address on v5 (v6 loads)."
    use: "Pipelined loops: lcc stores with `staaqp` (`memmove`, vectorized loops) and emits no `ldaaqp`."
    see: apb.md, "AAU loads"; loops.md
  - ops: ld{cs,ds,es,fs,gs,ss}qp st{cs,ds,es,fs,gs,ss}{qp,mqp} ldcudqp ldapqp stap{qp,mqp} ldrqp strqp
    does: "128-bit forms of the segment, protected-mode and privileged accesses: they fault in ordinary user mode (SIGILL, SIGSEGV or SIGBUS) as the v3 forms do."
    see: semantics.md, "Memory, tag and descriptor operations"
  - ops: ldgdqp stgd{qp,mqp}
    lat: "`ldgdqp` 11 (v6 5), as `ldqp` (32-bit processes)"
    does: "128-bit forms of `ldgd*`/`stgd*` (operations-v3.md): they fault in a 64-bit process as the v3 forms do; lcc's 32-bit code (`-mptr32`) makes its v5+ 16-byte atomics with `ldgdqp`/`stgdqp` as 64-bit code does with `ldqp`/`stqp`."
    see: spec/abi/mode32.md, "Timing", "16-byte atomics"; semantics.md, "Memory, tag and descriptor operations"
  - ops: puttagqp
    lat: "1 (4 to `addd` reading its low half)"
    does: "Set the tags of a 128-bit value, 2 bits per 32-bit word (the low 8 bits of b): tag 1 as asked (diagnostic where the word's bit 30 is set, empty where it is clear), 2 and 3 give 0; never traps, `,sm` or not (semantics.md, \"Tag operations\"); lcc gives speculatively loaded blocks tag 0 with it before testing them in string functions."
