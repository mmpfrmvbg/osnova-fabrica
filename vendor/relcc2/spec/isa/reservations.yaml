# the generator; see spec/NOTICE.md. Do not edit: regenerate.
# What each E2K operation reserves in a wide instruction, per ISA
# version: data for a scheduler's pipeline description.
source:
  binutils:
    project: MCST binutils (OpenE2K/binutils-gdb)
    commit: b4bebd940a30e3ec7b470f8c2a865b5a894e0d1d
    release: Binutils 2.41-29.023 from MCST
  inputs:
    spec/isa/binutils-ops.yaml: 04e2ee1359b17674a9a95222b16fecb40202d6ee
    spec/isa/timing-e2s.yaml: 3231cbee7053339ca95955a89cead580d10848db
    spec/isa/timing-e8c2.yaml: dfea5564edd82b8072467412d5ce66020a262184
    spec/isa/timing-e2c3.yaml: 0ae9bb4c6341ae690263423232f516c0f1efc592
  rules: the syllable rules in tools/isa-extract/gen_reservations.py, from spec/isa/bundle.md, predicates.md,
    control-transfer.md and MCST gas
isets: [2, 3, 4, 5, 6, 7]
notes:
- 'operations: per ALU operation, a list of forms, each valid for the ISA versions in isets. channels:
  the ALCs it may issue in (a paired one may be written with either channel of its pair). format and ales:
  per channel when they differ ({kind: [channels]}). ales: none (no ALES), default (0x01c0: a half-syllable
  in ALC0/1/3/4, nothing in ALC2/5) or value (a half-syllable in ALC0/1/3/4, the shared ALES2/ALES5 word
  in ALC2/5). literals: the literal sizes (bits) each operand may take (literals). ldst: load or store
  for the channel restrictions. mas: optional (CS1''s MAS field when the MAS is not 0) or always. pred_dst:
  writes a predicate; int_compare: counts for %cmpN. mrgc: needs an MRGC entry (cds). divider: uses the
  ALC5 divider. uses: control fields it also takes.'
- 'control_operations: the operations outside the ALU channels and the syllables or fields they take (wide_instruction).
  Two operations that use the same syllable or field cannot share a wide instruction, except within one
  CS1 group, MAS fields of different channels, PLS slots and CDS entries as described, and SS fields set
  to the same value.'
- Checked against decoded compiler output by tools/isa-extract/check_reservations.py.
wide_instruction:
  max_words: 16
  size: 'A wide instruction is 2-16 32-bit words (8-64 bytes, a multiple of 8): HS + SS + one ALS per
    busy channel + CS0 + the ALES2/ALES5 word + CS1, then the 16-bit halves (ALES0, 1, 3, 4, then AAS)
    rounded up to whole words, then LTS, PLS and CDS words, the total rounded up to an even number (bundle.md,
    "Overall layout"; gas: "wide instruction requires N syllables which exceeds the maximal supported
    size of 16 ones"); the LTS count is 1 + the highest LTS used, PLS 1 + the highest PLS used, and bundle.md,
    "Counting the size", has the whole rule.'
  syllables:
    hs:
      words: 1
      fields:
        nop: empty cycles after it, 0-7
        lm: loop_mode
        sw: set_mark
      note: always present
    ss:
      words: 1
      fields:
        ctop: 'the transfer: ct or call through %ctprN (N), or 0 for ibranch, rbranch, done, icall, hcall,
          ibranchd, icalld; one per instruction'
        ctcond: the one transfer condition (bundle.md, "ctcond")
        aa: which AAS mova syllables are present (type 0); abgc NUM or ctp_call (type 1)
        alc: alct/alcf
        abp: abpt/abpf
        abn: abnt/abnf
        abg: abgi/abgd (v2-v5); abgc/rbgc condition polarity (v6+)
        rp: 'crp, srp (both: slrp)'
        vfdi: ''
        bap: ''
        eap: ''
        ipd: instruction prefetch depth
        dtbp: v7
        type: '0: the fields above; 1 (v6+): abgc, rbgc, ctp_call'
      note: 'present when any field is used; a field may be set by two operations only to the same value
        (gas: "explicitly overriding a unique non-default value")'
    als:
      count: 6
      words: 1 each
      note: ALS0-ALS5, one operation per channel
    cs0:
      words: 1
      holds_one_of: [disp, ldisp, sdisp, return, gettsd, pref, puttsd, ibranch/rbranch displacement, icall/hcall
          displacement, done/iret/hret/glaunch]
      note: 'one prepare per instruction; ibranch, rbranch, icall and hcall keep their displacement here,
        so they exclude every prepare (gas: "CS0 in the current wide instruction is already busy"); puttsd:
        gas does not accept it'
    ales25:
      words: 1
      isets: [4, 5, 6, 7]
      note: ALES5 in bits 0-15, ALES2 in 16-31; emitted only when either is not the default 0x01c0 (on
        v4 also for an operation with explicit_ales25_v4); before v4 it does not exist, so ALC2 and ALC5
        take only operations with no ALES or the default one
    cs1:
      words: 1
      holds_one_group:
        setcmd:
          opcodes: [0, 1, 4]
          ops: [setwd, vfrpsz, settr, setbn, setbp]
          note: 'one CS1 for all of them: setwd/vfrpsz/settr pick opcode 0 or 1 and take LTS0, setbn and
            setbp are bits 26/27 of opcodes 0, 1 and 4 (lcc''s first instruction: setwd + setbn)'
        setei:
          opcodes: [2]
          ops: [setei]
        setsft:
          opcodes: [2]
          ops: [setsft]
          note: bit 27
        wait:
          opcodes: [3]
          ops: [wait]
        call:
          opcodes: [5]
          ops: [call, icall, hcall]
          note: wbs; a call cannot share with set*, wait or a MAS
        mas:
          opcodes: [6]
          ops: every load or store with a non-zero MAS, and aaurr/aaurw/mmurr/mmurw (always)
          note: one 7-bit field per channel 0, 2, 3, 5, so any number of MAS accesses share it (bundle.md,
            "Bundling restrictions"); a zero MAS needs no CS1 (gas omits it)
        flush:
          opcodes: [7]
          ops: [flushr, flushc, fillr, fillc]
        vfbg:
          opcodes: [8]
          ops: [vfbg]
          note: gas does not accept it
    ales_half:
      count: 4
      words: 1/2 each
      note: 'ALES0, ALES1, ALES3, ALES4: present when the channel''s operation has an ALES, default or
        not'
    aas:
      words: 1/2 each
      mova_channels: 4
      note: 'AAS0 (destinations of mova 0, 1) when mova channel 0 or 1 is used and AAS1 (mova 2, 3) when
        2 or 3 is, then one half per mova channel used (AAS2-AAS5; a movaq two): a mova in channel 2 alone
        is AAS1 + AAS4, one word; needs an SS of type 0'
    lts:
      count: 4
      words: 1 each
      note: literals, LTS0 first, placed from the end backwards in whatever room is left; the count is
        1 + the highest LTS used, not the number of literals (an explicit _lts2 alone takes three words);
        LTS0 is also setwd/vfrpsz/settr's (literals, below)
    pls:
      count: 3
      words: 1 each
      note: PLS0 (ELP @p0, @p1; CLP0 -> @p4), PLS1 (ELP @p2, @p3; CLP1 -> @p5), PLS2 (CLP2 -> @p6); using
        PLS N costs PLS0..N (predicates.md, "Slots and limits")
    cds:
      count: 3
      words: 1 each
      note: two 16-bit RLP/MRGC entries each, 6 in all
alu:
  clusters: [[0, 1, 2], [3, 4, 5]]
  mas_channels: [0, 2, 3, 5]
  note: a cluster selects the RLP/MRGC entry kind; crossing costs are timing (timing.md, "Clusters"),
    not reservations
literals:
  src1:
    5: '5-bit, zero-extended, in the ALS: free'
  src2:
    4: '4-bit, zero-extended, in the ALS: free'
    16: 'half of LTS0 or LTS1 (lo or hi), sign-extended: 1/2 word'
    32: 'one of LTS0-LTS3, sign-extended: 1 word'
    64: 'LTSn and LTSn+1, n = 0-2: 2 words'
  src3:
    32: 'v7 _lt3 forms: one LTS'
  aau:
    32: 'ldaa*/staa*: one LTS (the ALS lt field), zero-extended'
  lit8:
    8: 'ALOPF11_LIT8 and pshufh: in the ALES, free'
  sharing: operations of one instruction that need the same value share its LTS half or word (gas tc-e2k.c
    place_literal); four LTS at most, fewer when the other syllables leave less room; setwd/vfrpsz/settr
    take all of LTS0
  source: 'bundle.md, "Literal values" (gas and objdump: check_literals.py)'
pls:
  elp:
    slots: 4
    dst: ['@p0', '@p1', '@p2', '@p3']
    sources: '%predN, %lcntex, %spredN, %rndpredN, %bgrpred (no negation)'
  clp:
    slots: 3
    ops: [andp, landp, movep]
    inputs:
      clp0: ['@p0', '@p1']
      clp1: ['@p0', '@p1', '@p2', '@p3', '@p4']
      clp2: ['@p0', '@p1', '@p2', '@p3', '@p4', '@p5']
    dst:
      clp0: '@p4'
      clp1: '@p5'
      clp2: '@p6'
    max_depth: 2
    note: 'at most two levels (ELP -> CLP -> CLP: "maximal supported cascading of 2 exceeded"); a CLP
      may also pass its result to one %predN'
  source: predicates.md, "Slots and limits"; gas verify_pls_insns
cds:
  entries: 6
  entry: kind (RLP or MRGC) x cluster (ALC0-2 or ALC3-5) x predicate (%predN or %pcntN), with a channel
    mask and a negation bit per channel
  sharing: operations of one cluster with the same predicate and kind share one entry, each with its own
    negation; an operation may have one %pred and one %pcnt RLP (two entries) and a merge also an MRGC
  pairs: 'a two-channel operation''s entry covers both channels on v2-v6 (a (2, 5) pair: one entry per
    cluster) and only the lower channel on v7'
  extra_conditions: the staa AM increment (mask bit 3 of an RLP entry) and the srp/crp/slrp condition
    (mask bit 3 of MRGC entry 0)
  source: 'predicates.md, "RLP", "MRGC", "How much fits in one wide instruction"; gas: "out of free cds
    half-syllables"'
aas:
  mova_channels: [0, 1, 2, 3]
  movaq: 'takes mova channels N and N+1, N even (gas: "movaq should be encoded in an even channel"); v2-v6
    encode both, v7 only N'
  needs: an SS of type 0 (ss.aa marks each mova)
  source: bundle.md, "AAS"; gas parse_mova_args
restrictions:
- id: channel
  rule: every ALU operation in one of its form's channels (operations.channels)
  source: binutils-ops.yaml channels (gas supported_in_alc)
  check: checked
- id: one-op-per-channel
  rule: an ALU channel holds one operation; a paired operation holds both channels of its pair (pairs,
    pair_encoding), and getpl into a register also holds the next channel (implicit_pair)
  source: bundle.md, "Operations that take two channels"; gas place_alses
  check: checked
- id: ales
  rule: an operation has an ALES exactly when its form says so in that channel (operations.ales)
  source: bundle.md, "Operand roles per format"
  check: checked
- id: store-alc2-load-alc3
  rule: no store in ALC2 together with a load in ALC3
  forbid:
  - ldst: store
    channel: 2
  - ldst: load
    channel: 3
  source: gas place_alses ("the combination of STORE in ALC2 with LOAD in ALC3 is prohibited"); bundle.md,
    "Bundling restrictions"
  note: both channels of a paired load or store count; ldst comes from the table's LOAD/STORE flags, so
    AAU stores and aaurw* are stores, aaurr*/ldaa* and prefetches loads
  check: checked
- id: store-alc5-load-alc0
  rule: no store in ALC5 together with a load in ALC0
  forbid:
  - ldst: store
    channel: 5
  - ldst: load
    channel: 0
  source: as above
  check: checked
- id: cs0-one
  rule: 'one CS0 operation: one prepare (disp, ldisp, sdisp, return, gettsd), pref, or the displacement
    of ibranch/rbranch/icall/hcall, or done'
  source: bundle.md, "CS0" and "Bundling restrictions"; gas parse_copf2_args
  check: encoding (the checker reports reserved CS0 codes)
- id: ctop-one
  rule: 'one transfer: ct, call, ibranch, rbranch, done, icall, hcall, ibranchd or icalld (gas: "SS.ctop
    in the current wide instruction is already busy")'
  source: gas parse_ct_args, parse_ibranch_args, parse_alf2_args
  check: checked
- id: ctcond-one
  rule: one transfer condition per instruction, and none without a transfer; a conditional abgc/rbgc (v6+)
    uses it too, so it cannot share with a ct
  source: predicates.md, "Control transfers"
  check: checked
- id: cs1-one-group
  rule: 'CS1 holds one group: setcmd (setwd, setbn, setbp, vfrpsz, settr together), setei, setsft, wait,
    call, MAS (any number of accesses), flush (flushr, flushc, fillr, fillc together) or vfbg'
  source: 'bundle.md, "CS1" and "Bundling restrictions" ("cannot encode MAS: CS1 syllable is busy with
    set-instructions") [checked, v3, v5, v6]'
  check: encoding (the checker reports aaurr/aaurw/mmur* without the MAS group)
- id: mas
  rule: a MAS field is set only for a channel holding a MAS access (mas)
  source: bundle.md, "CS1"
  check: checked
- id: uses
  rule: no two operations of an instruction claim the same CS0, ss.ctop, ss.ctcond or CS1 group in control_operations.uses
    (the operations of one CS1 group share it)
  source: this file's control_operations, checked against compiled code
  check: checked
- id: same-ctpr
  isets: [2, 3, 4, 5]
  rule: a prepare (CS0) and a ct or call through the same %ctprN in one instruction (v6+ allows it, and
    the transfer then falls through)
  source: gas end_wide_command (MCST bug 154538); control-transfer.md, "Restrictions"
  check: checked
- id: ctpr-dst-alc0
  rule: movtd and getpl into %ctpr1-3 only in ALC0 (ctpr_dst_channels)
  source: gas parse_alf2_args ("may be encoded in the 0-th channel only"); bundle.md, "Bundling restrictions"
  check: checked
- id: ctcond-names-ops
  rule: a condition naming %cmpN (ctcond 9, 11) needs an integer compare (int_compare) in ALC N, %dt_alN
    (ctcond 8) a speculative operation in ALC N, %clpN (ctcond 9, 11) CLP N, in the same instruction
  source: gas end_wide_command, check_for_cmp; bundle.md, "ctcond"
  check: checked
- id: pls-slots
  rule: the CLP inputs and depth in pls; ELPs cannot be negated; only CLP results go back to %predN
  source: predicates.md, "Slots and limits"
  check: checked
- id: cds-entries
  rule: at most 6 RLP/MRGC entries (cds), each naming channels that hold an operation; a merge needs an
    MRGC entry; the AM bit needs a staa with incr, MRGC entry 0's bit 3 an srp/crp
  source: predicates.md, "How much fits in one wide instruction", "MRGC"
  check: checked
- id: lts-room
  rule: at most 4 LTS; a 16-bit literal only in a half of LTS0 or LTS1, a 64-bit one in LTS0-1, 1-2 or
    2-3; setwd/vfrpsz/settr take LTS0
  source: bundle.md, "Literal values"; gas place_literals
  check: checked
- id: literal-form
  rule: an operand takes only the literal sizes of its form (operations.literals); no literal store data
    or src3 before v7
  source: bundle.md, "Literal values"
  check: checked
- id: ales25-before-v4
  isets: [2, 3]
  rule: 'no ALES2/ALES5 word: an operation needing a non-default ALES can''t go in ALC2 or ALC5 (the channel
    lists already leave those out)'
  source: bundle.md, "ALES2 and ALES5"
  check: checked
- id: ss-type
  rule: mova*, bap, eap and vfdi need an SS of type 0; abgc, rbgc and ctp_call one of type 1, so they
    exclude each other
  source: gas parse_mova_args, parse_bap_args, parse_abgc_args, ...
  check: encoding
- id: movaq-even
  rule: movaq in mova channel 0 or 2, holding the next one too
  source: gas parse_mova_args
  check: checked
- id: size
  rule: everything fits in 16 words, sized as wide_instruction.size says
  source: bundle.md, "Overall layout", "Counting the size"; predicates.md ("HS + 6 ALS + 4 LTS + 2 PLS
    + 3 CDS = 16 assembles")
  check: checked
- id: ct11-flags
  isets: [7]
  rule: ctcond type 11 is false when alc, abn or abp have different t and f bits in the instruction (gas
    refuses it)
  source: gas end_wide_command (MCST bug 149213)
  check: checked
- id: dtbp-branch
  isets: [7]
  rule: dtbp only with an ibranch or rbranch
  source: gas parse_dtbp_args
  check: checked
- id: clp-shorthand
  rule: clpandp/clplandp only outside braces (a wide instruction of their own)
  source: predicates.md, "Slots and limits"
  check: gas
not_reservations:
- Two writes of one register in one instruction are allowed; the higher channel's result is left (bundle.md,
  "Two writes of one register"; predicates.md for predicates).
- Memory accesses to one address in one instruction take effect ALC2 before ALC5, a load before a store
  of its cluster (bundle.md, "Memory accesses in one wide instruction").
- Store bank conflicts (two stores agreeing in address bits 6-7, a store and a load in one 32-byte block)
  are timing, not reservations (timing.md, "Throughput").
- Cluster crossings, write-back conflicts and an ALC5 FP operation next to a divide (v5) are timing (timing.md,
  "Clusters", "Write-back conflicts", "Elbrus-8C2").
- A taken transfer runs every operation of its own wide instruction (gcc-port-plan.md, 7.3).
divider:
  channel: 5
  ops: [fdivd, fdivs, frcps, frsqrts, fsqrtid, fsqrts, fsqrttd, fxdivdd, fxdivdx, fxdivss, fxdivsx, fxdivtdd,
    fxdivtdx, fxdivtss, fxdivtsx, fxdivxd, fxdivxs, fxdivxx, fxsqrtidx, fxsqrtisx, fxsqrtixx, fxsqrttdx,
    fxsqrttsx, fxsqrttxx, fxsqrtudx, fxsqrtusx, fxsqrtuxx, pfdivd, pfdivs, pfsqrts, pfsqrttd, sdivd, sdivs,
    sdivx, smodx, udivd, udivs, udivx, umodx]
  rule: 'one pipelined unit in ALC5 shared by every divide, square root and reciprocal estimate (integer,
    FP, packed, 80-bit); in a run of one operation issued every g cycles it stalls when g is in that operation''s
    conflicts. A lone pair conflicts only 1 cycle apart, except after smodx/umodx (which hold the unit
    9 cycles) and after a single-precision square root, whose other distances depend on its operand; the
    runs don''t follow from the pairs (timing.md, "Divider": "Pairs", "Runs")'
  cycles_note: 'cycles: cycles per operation when one issues every g = 1..8 cycles, back to back with
    itself; mixed pairs measured at distance 1 cost as two of the same (timing.md, "Throughput", "The
    divider"); operations missing from a version''s ops were not measured; v2, v4 and v7 were not measured'
  by_version:
    v3:
      machine: Elbrus 4C
      source: spec/isa/timing-e2s.yaml
      ops:
        fdivd: {cycles: [5.01, 2.02, 3.02, 4.02, 5.02, 6.03, 7.03, 8.03], conflicts: [1]}
