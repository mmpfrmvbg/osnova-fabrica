control_operations:
  abg:
    isets: [2, 3, 4, 5]
    uses: [ss.abg]
    note: advance %bgr (v2-v5)
  abgc:
    isets: [6, 7]
    uses: [ss.type1, ss.abg, ss.aa, ss.ctcond]
    note: 'v6+: NUM in the aa1-aa3 bits of an SS of type 1, the condition''s predicate number in ctcond.psrc,
      its polarity in ss.abg'
  abn:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [ss.abn]
    note: advance the rotating register base
  abp:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [ss.abp]
    note: advance the rotating predicate base
  alc:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [ss.alc]
    note: advance loop counters
  andp:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [pls]
    note: a CLP
  bap:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [ss.type0, ss.bap]
    note: begin array prefetch
  call:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [ss.ctop, ss.ctcond, cs1.call]
    note: call through %ctprN; wbs in CS1
  clpandp:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [pls]
    note: shorthand that fills PLS0; gas refuses it inside braces
  clplandp:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [pls]
    note: as clpandp
  crp:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [ss.rp]
    note: as srp
  ct:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [ss.ctop, ss.ctcond]
    note: transfer through %ctprN
  ctp_call:
    isets: [7]
    uses: [ss.type1, ss.aa]
    note: v7
  disp:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [cs0]
    ctprs: [1, 2, 3]
    note: prepare a transfer to a label in %ctpr1-3
  done:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [ss.ctop, ss.ctcond, cs0]
    note: return from a trap (kernel)
  dtbp:
    isets: [7]
    uses: [ss.dtbp]
    note: v7; needs an ibranch or rbranch in the instruction
  eap:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [ss.type0, ss.eap]
    note: end array prefetch
  fapb:
    isets: [2, 3, 4, 5, 6, 7]
    uses: []
    note: an APB program instruction, not part of a wide instruction (apb.md)
  fillc:
    isets: [6, 7]
    uses: [cs1.flush]
    note: CS1 opcode 7, v6+
  fillr:
    isets: [6, 7]
    uses: [cs1.flush]
    note: CS1 opcode 7, v6+
  flushc:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [cs1.flush]
    note: CS1 opcode 7
  flushr:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [cs1.flush]
    note: CS1 opcode 7; combines with flushc, fillr, fillc
  flushts:
    isets: [3, 4, 5, 6, 7]
    uses: [ss]
    note: gas writes the whole SS (kernel only)
  gettsd:
    isets: [3, 4, 5, 6, 7]
    uses: [cs0]
    ctprs: [1, 2, 3]
    note: prepare from a type descriptor
  glaunch:
    isets: [6, 7]
    uses: [ss.ctop, ss.ctcond, cs0]
    note: hypervisor
  hcall:
    isets: [6, 7]
    uses: [ss.ctop, ss.ctcond, cs0, cs1.call]
    note: hypervisor call
  hret:
    isets: [6, 7]
    uses: [ss.ctop, ss.ctcond, cs0]
    note: hypervisor
  ibranch:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [ss.ctop, ss.ctcond, cs0]
    note: branch to the displacement in CS0
  icall:
    isets: [6, 7]
    uses: [ss.ctop, ss.ctcond, cs0, cs1.call]
    note: call to a displacement in CS0
  incr:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [als]
    note: 'AAU index increment: bits of the staa in the same channel (2 or 5); a condition of its own
      takes an RLP entry''s AM bit (cds)'
  ipd:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [ss.ipd]
    note: instruction prefetch depth; without an SS a default applies
  iret:
    isets: [6, 7]
    uses: [ss.ctop, ss.ctcond, cs0]
    note: kernel
  landp:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [pls]
    note: a CLP
  ldisp:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [cs0]
    ctprs: [2]
    note: prepare an array-prefetch program in %ctpr2
  loop_mode:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [hs.lm]
    note: loop-mode instruction
  movab:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [aas, ss.aa, ss.type0]
    note: array prefetch buffer read
  movad:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [aas, ss.aa, ss.type0]
  movah:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [aas, ss.aa, ss.type0]
  movaq:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [aas, ss.aa, ss.type0]
    note: two mova channels, the first even
  movaqp:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [aas, ss.aa, ss.type0]
    note: one mova channel
  movaw:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [aas, ss.aa, ss.type0]
  movep:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [pls]
    note: an MLP (a CLP slot)
  nop:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [hs.nop]
    note: empty cycles after the instruction, 0-7
  pass:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [pls]
    note: an ELP (into @p0-@p3) or a CLP's result into %predN
  pref:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [cs0]
    note: instruction prefetch to %iprN
  rbgc:
    isets: [6, 7]
    uses: [ss.type1, ss.abg, ss.aa, ss.ctcond]
    note: v6+, as abgc
  rbranch:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [ss.ctop, ss.ctcond, cs0]
    note: ibranch for DAM recovery (%MLOCK)
  return:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [cs0]
    ctprs: [3]
    note: prepare the return in %ctpr3
  sdisp:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [cs0]
    ctprs: [1, 2, 3]
    note: prepare a system call
  set_mark:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [hs.sw]
  setbn:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [cs1.setcmd]
    note: rotating register base; shares CS1 with setwd, setbp
  setbp:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [cs1.setcmd]
    note: rotating predicate base; shares CS1 with setwd, setbn
  setei:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [cs1.setei]
    note: CS1 opcode 2
  setsft:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [cs1.setsft]
    note: CS1 opcode 2 with bit 27; a software trap
  settr:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [cs1.setcmd, lts0]
    note: type in LTS0 bits 17-31
  setwd:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [cs1.setcmd, lts0]
    note: wsz, nfx, dbl in LTS0; may share CS1 with setbn, setbp
  slrp:
    isets: [3, 4, 5, 6, 7]
    uses: [ss.rp]
    note: as srp; crp and srp bits together
  srp:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [ss.rp]
    note: recovery point; a condition takes MRGC entry 0 (cds)
  vfdi:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [ss.type0, ss.vfdi]
  vfrpsz:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [cs1.setcmd, lts0]
    note: rpsz in LTS0 bits 12-16; CS1 opcode 1
  wait:
    isets: [2, 3, 4, 5, 6, 7]
    uses: [cs1.wait]
    note: CS1 opcode 3
