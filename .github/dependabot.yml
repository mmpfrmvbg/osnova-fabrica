version: 2
# ОБНОВЛЕНИЯ ЗАВИСИМОСТЕЙ — ДЛЯ АГЕНТА, А НЕ ДЛЯ ВЛАДЕЛЬЦА (2026-11-12).
#
# Владелец проекта не программист и не разбирает pull request. Раньше бот открывал
# по одному PR на каждую зависимость: 9 открытых сразу, из них 5 — на действия GitHub.
# Смотреть на них владельцу нечем, а агент тонул в шуме.
#
# `groups` собирает обновления в НЕСКОЛЬКО PR вместо десятка: одно действие GitHub и
# npm-мелочь — по одному PR, мажорные npm — отдельно (их слияние проверяется глазами
# агента, потому что мажор меняет поведение). Сколько бы ни пришло обновлений, открытых
# PR от бота не больше трёх, и `npm run pr:merge -- --apply` их разбирает.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      npm-major:
        patterns: ['*']
        update-types: ['major']
