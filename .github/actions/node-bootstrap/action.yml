name: Node bootstrap
description: Setup Node from .nvmrc and run npm ci

inputs:
  working-directory:
    description: Directory where npm ci should run
    required: false
    default: .
  cache-dependency-path:
    description: Optional dependency lock path for npm cache key
    required: false
    default: ''
  install_command:
    description: Command used to install dependencies
    required: false
    default: npm ci

runs:
  using: composite
  steps:
    - name: Setup Node.js (default cache)
      if: ${{ inputs.cache-dependency-path == '' }}
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Setup Node.js (custom cache path)
      if: ${{ inputs.cache-dependency-path != '' }}
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install dependencies
      shell: bash
      run: |
        if [ "${{ inputs.working-directory }}" != "." ]; then
          cd "${{ inputs.working-directory }}"
        fi
        ${{ inputs.install_command }}
