name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/osiris-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, osnova]
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Переопределите в GitHub Variables при смене VPS (repo → Settings → Variables).
      OSIRIS_VPS_HOST: ${{ vars.OSIRIS_VPS_HOST }}
      OSIRIS_VPS_USER: ${{ vars.OSIRIS_VPS_USER }}
      OSIRIS_VPS_OTA_DIR: ${{ vars.OSIRIS_VPS_OTA_DIR }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3

      - name: Set version from workflow run
        working-directory: apps/osiris-android/app
        run: |
          sed -i 's/versionCode = [0-9][0-9]*/versionCode = ${{ github.run_number }}/' build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "0.1.${{ github.run_number }}"/' build.gradle.kts

      - name: Make gradlew executable
        working-directory: apps/osiris-android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: apps/osiris-android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: osiris-release-apk
          path: apps/osiris-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="osiris-android-${{ github.run_number }}-$(date -u +'%Y%m%d-%H%M%S')"
          APK="apps/osiris-android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" osiris-android-release.apk
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Osiris Android 0.1.${{ github.run_number }}" \
            --notes "Автосборка с main (run #${{ github.run_number }}). Установка: скачайте **osiris-android-release.apk**." \
            osiris-android-release.apk
        env:
          GH_TOKEN: ${{ env.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Setup SSH agent for VPS upload
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.OSIRIS_VPS_SSH_KEY }}

      - name: Upload APK + latest.json to VPS for Android OTA
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          SSH_HOST="${OSIRIS_VPS_HOST:-90.156.210.111}"
          SSH_USER="${OSIRIS_VPS_USER:-root}"
          LATEST_DIR="${OSIRIS_VPS_OTA_DIR:-/opt/osnova/android-ota}"
          APK_PATH="apps/osiris-android/app/build/outputs/apk/release/app-release.apk"
          APK_URL="http://${SSH_HOST}:3000/ota/android/app.apk"
          VERSION_CODE="${{ github.run_number }}"
          LATEST_PATH="$LATEST_DIR/latest.json"

          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # shellcheck disable=SC2029
          ssh "$SSH_USER@$SSH_HOST" "mkdir -p $LATEST_DIR"
          scp "$APK_PATH" "$SSH_USER@$SSH_HOST:$LATEST_DIR/app.apk"

          echo "{\"versionCode\":$VERSION_CODE,\"apkUrl\":\"$APK_URL\"}" > latest.json
          scp latest.json "$SSH_USER@$SSH_HOST:$LATEST_PATH"
          rm -f latest.json