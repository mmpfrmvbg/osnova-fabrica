name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/chat-web/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/chat-web/package-lock.json

      - name: Install dependencies
        working-directory: apps/chat-web
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/chat-web/android/**/*.gradle*', 'apps/chat-web/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Add Android platform
        working-directory: apps/chat-web
        run: npx cap add android || echo "Android platform already exists"

      - name: Sync Capacitor
        working-directory: apps/chat-web
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: apps/chat-web/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: apps/chat-web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: osiris-debug-${{ github.sha }}
          path: apps/chat-web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
