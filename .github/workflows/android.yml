name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/osiris-android/**'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        working-directory: apps/osiris-android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: apps/osiris-android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: osiris-debug-apk
          path: apps/osiris-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="osiris-android-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Osiris Android $TAG" \
            --notes "Автоматический релиз ОСИРИС Android из CI" \
            apps/osiris-android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GH_TOKEN: ${{ env.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
