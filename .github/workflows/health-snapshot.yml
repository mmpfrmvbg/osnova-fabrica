name: Health Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health-snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HEALTH_ANALYSIS_SINCE: '2026-01-01T00:00:00.000Z'

jobs:
  snapshot:
    name: save health snapshot
    uses: ./.github/workflows/reusable-node-run.yml
    with:
      fetch-depth: 0
      commands-file: .github/workflow-scripts/health-snapshot.sh
      health-analysis-since: ${{ env.HEALTH_ANALYSIS_SINCE }}
    secrets: inherit
