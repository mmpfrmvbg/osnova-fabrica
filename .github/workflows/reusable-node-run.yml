name: Reusable Node Run

on:
  workflow_call:
    inputs:
      fetch-depth:
        description: Git fetch depth for checkout
        required: false
        type: number
        default: 1
      checkout-persist-credentials:
        description: Keep checkout credentials for subsequent git commands
        required: false
        type: boolean
        default: false
      working-directory:
        description: Working directory for command execution
        required: false
        type: string
        default: '.'
      cache-dependency-path:
        description: Optional dependency lock path for npm cache key
        required: false
        type: string
        default: ''
      install_command:
        description: Command used to install dependencies in bootstrap step
        required: false
        type: string
        default: npm ci
      commands:
        description: Newline-separated shell commands to execute
        required: false
        type: string
        default: ''
      commands-file:
        description: Path to shell script file in repository (alternative to commands)
        required: false
        type: string
        default: ''
      regression-health-since:
        description: Optional value exported to REGRESSION_HEALTH_SINCE
        required: false
        type: string
        default: ''
      health-analysis-since:
        description: Optional value exported to HEALTH_ANALYSIS_SINCE
        required: false
        type: string
        default: ''
      dataset_export_since:
        description: Optional value exported to DATASET_EXPORT_SINCE
        required: false
        type: string
        default: ''
      artifact-name:
        description: Optional artifact name to upload
        required: false
        type: string
        default: ''
      artifact-path:
        description: Optional artifact file/path/glob to upload
        required: false
        type: string
        default: ''
      artifact-retention-days:
        description: Artifact retention days
        required: false
        type: number
        default: 30
      artifact-if-no-files-found:
        description: Action when artifact path has no files (warn, error, ignore)
        required: false
        type: string
        default: warn
      timeout_minutes:
        description: Job timeout in minutes
        required: false
        type: number
        default: 40
      runs_on:
        description: Runner labels as JSON array
        required: false
        type: string
        default: '["self-hosted","Linux","X64","osnova"]'
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      DEEPSEEK_API_KEY:
        required: false
      OSNOVA_MODEL:
        required: false
      OSNOVA_API_KEY:
        required: false

jobs:
  run:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          token: ${{ github.token }}
          persist-credentials: ${{ inputs.checkout-persist-credentials }}

      - name: Setup Node + install dependencies
        uses: ./.github/actions/node-bootstrap
        with:
          working-directory: ${{ inputs.working-directory }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install_command: ${{ inputs.install_command }}

      - name: Validate command source
        shell: bash
        run: |
          if [ -z "${{ inputs.commands }}" ] && [ -z "${{ inputs.commands-file }}" ]; then
            echo "Either inputs.commands or inputs.commands-file must be provided."
            exit 1
          fi
          if [ -n "${{ inputs.commands }}" ] && [ -n "${{ inputs.commands-file }}" ]; then
            echo "Use only one input source: commands OR commands-file."
            exit 1
          fi

      - name: Prepare commands from inline input
        if: ${{ inputs.commands != '' }}
        shell: bash
        run: |
          SCRIPT_PATH="$RUNNER_TEMP/github-reusable-commands.sh"
          cat > "$SCRIPT_PATH" <<'REUSABLE_CMDS_EOF_OSNOVA_7f3a9c2e1b8d4a6e'
          ${{ inputs.commands }}
          REUSABLE_CMDS_EOF_OSNOVA_7f3a9c2e1b8d4a6e
          echo "REUSABLE_COMMANDS_FILE=$SCRIPT_PATH" >> "$GITHUB_ENV"

      - name: Prepare commands from file input
        if: ${{ inputs.commands-file != '' }}
        shell: bash
        run: |
          SOURCE_FILE="${{ github.workspace }}/${{ inputs.commands-file }}"
          SCRIPT_PATH="$RUNNER_TEMP/github-reusable-commands.sh"
          if [ ! -f "$SOURCE_FILE" ]; then
            echo "commands-file not found: ${{ inputs.commands-file }}"
            exit 1
          fi
          cp "$SOURCE_FILE" "$SCRIPT_PATH"
          echo "REUSABLE_COMMANDS_FILE=$SCRIPT_PATH" >> "$GITHUB_ENV"

      - name: Run commands
        working-directory: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OSNOVA_MODEL: ${{ secrets.OSNOVA_MODEL }}
          OSNOVA_API_KEY: ${{ secrets.OSNOVA_API_KEY }}
          REGRESSION_HEALTH_SINCE: ${{ inputs.regression-health-since }}
          HEALTH_ANALYSIS_SINCE: ${{ inputs.health-analysis-since }}
          DATASET_EXPORT_SINCE: ${{ inputs.dataset_export_since }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$REUSABLE_COMMANDS_FILE"
          bash "$REUSABLE_COMMANDS_FILE"

      - name: Upload artifact
        if: ${{ inputs.artifact-path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name != '' && inputs.artifact-name || format('artifact-{0}', github.run_id) }}
          path: ${{ inputs.artifact-path }}
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: ${{ inputs.artifact-if-no-files-found }}
