name: CLI Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package (editable + dev)
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest tests/ -v --tb=short

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package (editable + dev)
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest tests/ -v --tb=short
