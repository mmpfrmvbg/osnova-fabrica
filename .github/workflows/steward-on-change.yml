name: Steward on Change

on:
  pull_request:
    paths:
      - 'src/**'
      - 'docs/**'
      - 'docs/golden-tests.json'

concurrency:
  group: steward-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-gate:
    name: Golden Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-bootstrap
      - name: Run golden tests
        run: npm run golden

  language-surface:
    name: Language Surface Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/node-bootstrap
      - name: Detect changed files
        id: changed
        uses: tj-actions/changed-files@2d756ea4c53f7f6b397767d8723b3a10a9f35bf2 # v44
        with:
          files: |
            src/compiler/**
            docs/language-v1.md
            docs/golden-tests.json
            src/pipeline-llm/buildOsnovaPrompt.ts
      - name: Analyze language health (if language files changed)
        if: steps.changed.outputs.any_changed == 'true'
        run: npm run analyze-language-health -- --input runs/traces.jsonl || true
      - name: Typecheck
        run: npm run typecheck
