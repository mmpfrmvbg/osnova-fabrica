name: Steward on Change

on:
  pull_request:
    paths:
      - 'src/**'
      - 'docs/**'
      - 'docs/golden-tests.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  golden-gate:
    name: Golden Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/node-bootstrap
      - name: Run golden tests
        run: npm run golden

  language-surface:
    name: Language Surface Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/node-bootstrap
      - name: Detect changed files
        id: changed
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5
        with:
          files: |
            src/compiler/**
            docs/language-v1.md
            docs/golden-tests.json
            src/pipeline-llm/buildOsnovaPrompt.ts
      - name: Analyze language health (if language files changed)
        if: steps.changed.outputs.any_changed == 'true'
        run: npm run analyze-language-health -- --input runs/traces.jsonl || true
      - name: Typecheck
        run: npm run typecheck
