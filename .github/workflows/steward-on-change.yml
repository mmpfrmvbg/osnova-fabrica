name: Steward on Change

on:
  pull_request:
    paths:
      - 'src/**'
      - 'docs/**'
      - 'docs/golden-tests.json'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: steward-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-gate:
    name: Golden Gate
    runs-on: [self-hosted, Linux, X64, osnova]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/node-bootstrap
      - name: Run golden tests
        run: npm run golden

  language-surface:
    name: Language Surface Check
    runs-on: [self-hosted, Linux, X64, osnova]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/node-bootstrap
      - name: Detect changed files
        id: changed
        uses: tj-actions/changed-files@2d756ea4c53f7f6b397767d8723b3a10a9f35bf2 # v44
        with:
          files: |
            src/compiler/**
            docs/language-v1.md
            docs/golden-tests.json
            src/pipeline-llm/buildOsnovaPrompt.ts
      - name: Analyze language health (if language files changed)
        if: steps.changed.outputs.any_changed == 'true'
        run: npm run analyze-language-health -- --input runs/traces.jsonl || true
      - name: Typecheck
        run: npm run typecheck
