name: Intelligence Weekly Collect + Digest

on:
  schedule:
    - cron: '0 6 * * 1' # каждый понедельник 06:00 UTC
  workflow_dispatch: # ручной запуск для тестирования

# collector.ts: HTTPS к arxiv / RSS и GitHub API repos/*/releases/latest (публичные репо).

concurrency:
  group: intelligence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intelligence:
    name: collect signals + send digest
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-node-run.yml
    with:
      runs_on: '["ubuntu-latest"]'
      fetch-depth: 0
      commands: |
        npm run intelligence-collect
        npm run intelligence-digest
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OSNOVA_MODEL: ${{ secrets.OSNOVA_MODEL }}
      OSNOVA_API_KEY: ${{ secrets.OSNOVA_API_KEY }}
