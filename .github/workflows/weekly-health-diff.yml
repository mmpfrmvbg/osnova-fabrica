name: Weekly Health Diff

on:
  schedule:
    - cron: '0 9 * * 0' # каждое воскресенье 09:00 UTC
  workflow_dispatch: # ручной запуск для тестирования

concurrency:
  group: weekly-health-diff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weekly-diff:
    name: weekly health diff to Telegram
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-node-run.yml
    with:
      fetch-depth: 0
      commands: |
        npm run health-diff
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
