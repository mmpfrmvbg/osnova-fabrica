name: Weekly Health Diff

on:
  schedule:
    - cron: '0 9 * * 0' # каждое воскресенье 09:00 UTC
  workflow_dispatch: # ручной запуск для тестирования

jobs:
  weekly-diff:
    name: weekly health diff to Telegram
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run health diff
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run health-diff
