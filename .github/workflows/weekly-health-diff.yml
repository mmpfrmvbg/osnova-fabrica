name: Weekly Health Diff

on:
  schedule:
    - cron: '0 9 * * 0' # каждое воскресенье 09:00 UTC
  workflow_dispatch: # ручной запуск для тестирования

permissions:
  contents: read

jobs:
  weekly-diff:
    name: weekly health diff to Telegram
    uses: ./.github/workflows/reusable-node-run.yml
    with:
      fetch-depth: 0
      commands: |
        npm run health-diff
    secrets: inherit
