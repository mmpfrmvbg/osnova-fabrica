name: Batch Run

on:
  workflow_dispatch:
    inputs:
      tasks_file:
        description: 'Путь к файлу задач (относительно корня репо)'
        required: false
        default: 'src/scripts/batch-tasks.txt'
      dry_run:
        description: 'Dry-run режим (1 = без реального LLM)'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: batch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  batch:
    name: batch-run
    uses: ./.github/workflows/reusable-node-run.yml
    with:
      commands: |
        OSNOVA_DRY_RUN="${{ github.event.inputs.dry_run }}" \
        OSNOVA_STORAGE_ROOT="/tmp/osnova-storage-ci" \
        npx tsx src/scripts/batch-run.ts "${{ github.event.inputs.tasks_file }}"
      artifact-name: batch-results-${{ github.run_id }}
      artifact-path: runs/batch-*.json
      artifact-retention-days: 30
    secrets: inherit
