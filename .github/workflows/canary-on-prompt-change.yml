name: Canary on Prompt/Docs Change

on:
  push:
    branches: [main]
    paths:
      - 'src/prompts/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    name: canary batch + shadow report
    uses: ./.github/workflows/reusable-node-run.yml
    with:
      fetch-depth: 0
      commands: |
        OSNOVA_DRY_RUN=1 npm run batch-run
        npm run shadow-report -- --gate-json runs/shadow-gate.json
        R2=$(node -p "require('./runs/shadow-gate.json').rfc002")
        R3=$(node -p "require('./runs/shadow-gate.json').rfc003")
        ACTIONS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        if awk -v r="$R2" 'BEGIN{exit !(r+0 < 80)}'; then
          npm run report-to-pm -- \
            --priority WARN \
            --metric "RFC-002.correctRate=${R2}%" \
            --actions-url "$ACTIONS_URL"
        fi
        if awk -v r="$R3" 'BEGIN{exit !(r+0 < 95)}'; then
          npm run report-to-pm -- \
            --priority WARN \
            --metric "RFC-003.correctRate=${R3}%" \
            --actions-url "$ACTIONS_URL"
        fi
    secrets: inherit
