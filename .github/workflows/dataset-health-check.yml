name: Dataset Health Check

on:
  push:
    branches: [main]
    paths:
      - 'src/prompts/few-shot/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataset-health:
    name: dataset health gate
    # Не блокирует merge: даже при dataset WARN workflow завершается успешно.
    uses: ./.github/workflows/reusable-node-run.yml
    with:
      commands-file: .github/workflow-scripts/dataset-health-check.sh
      dataset_export_since: ${{ vars.DATASET_EXPORT_SINCE || '2026-03-21' }}
    secrets: inherit
