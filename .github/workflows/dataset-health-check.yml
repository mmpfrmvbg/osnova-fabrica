name: Dataset Health Check

on:
  push:
    branches: [main]
    paths:
      - 'src/prompts/few-shot/**'

permissions:
  contents: read

env:
  DATASET_EXPORT_SINCE: '2026-03-21'

jobs:
  dataset-health:
    name: dataset health gate
    # Не блокирует merge: даже при dataset WARN workflow завершается успешно.
    uses: ./.github/workflows/reusable-node-run.yml
    with:
      commands: |
        npm run export-dataset-v2 -- --since "${{ env.DATASET_EXPORT_SINCE }}"
        set +e
        npm run dataset-stats
        STATS_EXIT=$?
        set -e
        if [ "$STATS_EXIT" -ne 0 ]; then
          npm run report-to-pm -- \
            --priority WARN \
            --metric "dataset-health=WARN (категория < 10% или total < 200)" \
            --actions-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        fi
        exit 0
    secrets: inherit
