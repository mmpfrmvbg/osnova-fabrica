# OSNOVA v5.2 — Brain EPIC Intake
# Срабатывает когда Brain создаёт Issue с label brain-epic
# Пишет номер Issue в forge/epic-queue.txt в репозитории
# Локальный forge.py читает этот файл каждую минуту через git pull

name: 01 Brain EPIC Intake

on:
  issues:
    types: [labeled]

jobs:
  intake:
    name: Queue EPIC for local forge
    runs-on: ubuntu-latest
    # Только если привязан лейбл brain-epic
    if: github.event.label.name == 'brain-epic'

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Write issue number to epic-queue.txt
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "Writing EPIC #${ISSUE_NUMBER} to forge/epic-queue.txt"
          mkdir -p forge
          echo "${ISSUE_NUMBER}" >> forge/epic-queue.txt
          echo "Queued at $(date -u +%Y-%m-%dT%H:%M:%SZ): #${ISSUE_NUMBER} — ${ISSUE_TITLE}" >> forge/epic-queue.log

      - name: Commit queue update
        run: |
          git config user.name  "osnova-brain[bot]"
          git config user.email "osnova-brain@users.noreply.github.com"
          git add forge/epic-queue.txt forge/epic-queue.log
          git diff --staged --quiet || git commit -m "brain: queue EPIC #${{ github.event.issue.number }}"
          git push

      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '**\u23f3 OSNOVA Forge** — EPIC получен и поставлен в очередь.',
                '',
                `**Issue:** #${context.issue.number}`,
                `**Queue file:** \`forge/epic-queue.txt\``,
                '',
                'Forge прочитает очередь при следующем `git pull` (каждые 60с).',
                'ATM-выполнение начнётся автоматически.'
              ].join('\n')
            });
