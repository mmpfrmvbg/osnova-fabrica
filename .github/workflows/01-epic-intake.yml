# OSNOVA v5.2 — Brain EPIC Intake (queue file + optional unix socket wake)
#
# Рекомендуемая схема: forge, Actions runner и клон репо на **одной машине**.
# `runs-on: [self-hosted, osnova-forge]` совпадает с 07-heart-alert — job видит epic.sock и heartbeat.
#
# Queue: коммитит <repo>/forge/epic-queue.txt; forge читает через epic_queue_path() после git pull
# (forge/common.py). Для wake без ожидания poll: `socat` на PATH и путь FORGE_EPIC_SOCKET → epic.sock.
name: 01 Brain EPIC Intake

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: epic-intake-${{ github.repository }}
  cancel-in-progress: false

jobs:
  intake:
    name: Queue EPIC for local forge
    runs-on: [self-hosted, osnova-forge]
    if: |
      (
        github.event.action == 'opened' &&
        contains(github.event.issue.labels.*.name, 'brain-epic')
      ) || (
        github.event.action == 'labeled' &&
        github.event.label.name == 'brain-epic'
      )

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Write issue number to epic-queue.txt
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "Writing EPIC #${ISSUE_NUMBER} to forge/epic-queue.txt"
          mkdir -p forge
          if [ -f forge/epic-queue.txt ] && grep -qxF "${ISSUE_NUMBER}" forge/epic-queue.txt; then
            echo "Issue #${ISSUE_NUMBER} already queued — skip duplicate append"
          else
            echo "${ISSUE_NUMBER}" >> forge/epic-queue.txt
          fi
          echo "Queued at $(date -u +%Y-%m-%dT%H:%M:%SZ): #${ISSUE_NUMBER} — ${ISSUE_TITLE}" >> forge/epic-queue.log || true

      - name: Notify forge via Unix socket (co-located runner)
        continue-on-error: true
        run: |
          ISSUE_NUM=${{ github.event.issue.number }}
          SOCK="${FORGE_EPIC_SOCKET:-/opt/osnova-forge/epic.sock}"
          if command -v socat >/dev/null 2>&1 && [ -S "$SOCK" ]; then
            printf '{"issue_number": %s}' "$ISSUE_NUM" | timeout 5 socat - UNIX-CONNECT:"$SOCK" && echo "socket_ok=1" || echo "socket_ok=0"
          else
            echo "socket_skipped (install socat and run forge with epic.sock, or rely on git pull)"
          fi

      - name: Commit queue update
        run: |
          git config user.name  "osnova-brain[bot]"
          git config user.email "osnova-brain@users.noreply.github.com"
          git add forge/epic-queue.txt
          git add -f forge/epic-queue.log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "brain: queue EPIC #${{ github.event.issue.number }}"
          git push

      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '**\u23f3 OSNOVA Forge** — EPIC получен и поставлен в очередь.',
                '',
                `**Issue:** #${context.issue.number}`,
                `**Queue file:** \`forge/epic-queue.txt\` (канонический путь для \`git pull\`)`,
                '',
                'При **self-hosted на машине forge** этот же job может дернуть `epic.sock` (нужен `socat`). Иначе очередь подхватится на следующем `git pull` в цикле forge.',
              ].join('\n'),
            });
