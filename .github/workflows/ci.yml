name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

run-name: CI • ${{ github.event_name }} • ${{ github.ref_name }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck + test + lint + golden
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-node-run.yml
    with:
      # Self-hosted for PR + push: same runner as rest of repo; saves GitHub-hosted minutes on private Free tier.
      runs_on: '["self-hosted","Linux","X64","osnova"]'
      commands-file: .github/workflow-scripts/ci-main.sh

  test-osiris:
    name: osiris tests (27)
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-node-run.yml
    with:
      runs_on: '["self-hosted","Linux","X64","osnova"]'
      working-directory: apps/osiris
      cache-dependency-path: apps/osiris/package-lock.json
      install_command: npm ci --no-audit
      commands-file: .github/workflow-scripts/ci-osiris.sh
