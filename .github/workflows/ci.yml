name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

run-name: CI • ${{ github.event_name }} • ${{ github.ref_name }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: типы + линт + тесты + шлюзы
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Node из .nvmrc + npm ci
        uses: ./.github/actions/node-bootstrap

      - name: Каталог отчётов
        shell: bash
        run: mkdir -p .tmp

      - name: Типы (tsc)
        run: npm run typecheck

      - name: Линт (eslint)
        run: npm run lint

      - name: Тесты (vitest + сторожа счёта и схемы)
        run: npm test

      # gate:metrics в CI не включён осознанно: числа ядер печатаются без модели, но
      # сверка с эталоном идёт ПОСЛЕ прогона среза, а срез требует qemu-e2k в WSL.
      # На раннере модели нет — шаг вернул бы 3 «срез не спрошен», и красное означало
      # бы отсутствие внешнего ресурса, а не дефект. Числа шлюза проверяются локально
      # и на стенде: `npm run gate:metrics` (см. README, раздел «Репозитории»).

      - name: Документация (реестр и ссылки)
        run: npm run docs:check

      - name: Дрейф YAML
        run: npm run check:yaml-drift

      - name: Реестр языка
        run: npm run validate:spec

      - name: Артефакт отчёта vitest
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: vitest-report
          path: .tmp/vitest-report.json
          if-no-files-found: warn
          retention-days: 14
