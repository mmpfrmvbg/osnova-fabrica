name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

run-name: CI • ${{ github.event_name }} • ${{ github.ref_name }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck + test + lint + golden
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-node-run.yml
    with:
      runs_on: ${{ github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","osnova"]' }}
      commands-file: .github/workflow-scripts/ci-main.sh

  test-osiris:
    name: osiris tests (27)
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-node-run.yml
    with:
      runs_on: ${{ github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","osnova"]' }}
      working-directory: apps/osiris
      cache-dependency-path: apps/osiris/package-lock.json
      install_command: npm ci --no-audit
      commands-file: .github/workflow-scripts/ci-osiris.sh

  forge-close-pending-ci:
    name: Forge — close pending-ci issue (state.yaml)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, test-osiris]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Install PyYAML and run closer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          pip install pyyaml -q
          python forge/close_pending_ci.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .osnova/state.yaml 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: clear ci_pending_issue after CI green" && git push)
