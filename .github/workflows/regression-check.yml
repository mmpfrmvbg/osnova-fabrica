name: Regression Check

on:
  push:
    branches: [main]
    paths:
      - 'src/**'

jobs:
  regression-check:
    name: language health gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for bisect)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Language health gate
        run: npm run analyze-language-health -- --since 2026-03-21T00:00:00.000Z

      - name: Blame-mode bisect on regression
        if: failure()
        run: npm run blame-mode-bisect

      - name: Report to PM
        if: failure()
        run: npm run report-to-pm -- --priority CRITICAL --stop-factory
