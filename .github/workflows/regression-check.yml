name: Regression Check

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-check:
    name: language health gate
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-node-run.yml
    with:
      fetch-depth: 0
      commands-file: .github/workflow-scripts/regression-check.sh
      regression-health-since: ${{ vars.REGRESSION_HEALTH_SINCE || '2026-03-21T00:00:00.000Z' }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OSNOVA_MODEL: ${{ secrets.OSNOVA_MODEL }}
      OSNOVA_API_KEY: ${{ secrets.OSNOVA_API_KEY }}
