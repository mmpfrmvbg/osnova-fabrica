name: Regression Check

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-check:
    name: language health gate
    uses: ./.github/workflows/reusable-node-run.yml
    with:
      fetch-depth: 0
      commands-file: .github/workflow-scripts/regression-check.sh
      regression-health-since: ${{ vars.REGRESSION_HEALTH_SINCE || '2026-03-21T00:00:00.000Z' }}
    secrets: inherit
