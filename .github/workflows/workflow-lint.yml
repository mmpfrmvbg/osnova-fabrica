name: Workflow Lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/workflow-scripts/**'
      - 'actionlint.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/workflow-scripts/**'
      - 'actionlint.yaml'
  workflow_dispatch:

run-name: Workflow Lint • ${{ github.event_name }} • ${{ github.ref_name }}

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: [self-hosted, Linux, X64, osnova]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install shellcheck
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Install actionlint
        shell: bash
        run: |
          if ! command -v go >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y golang-go
          fi
          GOPATH_BIN="$(go env GOPATH)/bin"
          echo "$GOPATH_BIN" >> "$GITHUB_PATH"
          go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Shellcheck scripts
        shell: bash
        run: shellcheck .github/workflow-scripts/*.sh

      - name: Lint workflows
        shell: bash
        run: actionlint -color
