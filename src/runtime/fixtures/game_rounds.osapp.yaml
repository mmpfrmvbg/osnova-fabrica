id: "osnova.game_rounds"
name: "Игровые раунды (Game)"
version: "0.1.0"

entry:
  module: "game_rounds"
  procedure: "run_golden"
  args:
    - - результат: "победа"
        очки: 15
      - результат: "поражение"
        очки: 5
      - результат: "победа"
        очки: 10

category: "game"

ui:
  kind: "window"
  single_instance: false

permissions:
  files:
    read: []
    write: []
  network:
    outbound: false

runtime:
  min_osnova_version: "0.1.0"
