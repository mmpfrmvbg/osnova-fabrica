id: "notepad.osn"
name: "Блокнот ОСи"
version: "0.1.0"

entry:
  module: "блокнот"
  procedure: "запуск"
  args: []

category: "utility"

ui:
  kind: "window"
  single_instance: true

permissions:
  files:
    read: ["~/Документы"]
    write: ["~/Документы/ОСь"]
  network:
    outbound: false
  system:
    clipboard: true

runtime:
  min_osnova_version: "0.1.0"
  min_os_version: "0.1.0"
