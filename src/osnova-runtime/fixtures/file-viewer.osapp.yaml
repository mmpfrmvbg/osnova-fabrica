id: "osnova.viewer"
name: "File Viewer ОСи"
version: "0.1.0"

entry:
  module: "viewer"
  procedure: "запуск"
  args: []

category: "utility"

ui:
  kind: "window"
  single_instance: false

permissions:
  files:
    read: ["~/Документы"]
    write: []
  network:
    outbound: false

runtime:
  min_osnova_version: "0.1.0"

