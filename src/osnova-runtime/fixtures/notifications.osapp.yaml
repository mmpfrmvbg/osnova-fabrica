# Системный сервис «Уведомления ОСи» — первый kind: service в реестре.
id: "osnova.notifications"
name: "Уведомления ОСи"
version: "0.1.0"

entry:
  module: "notifications"
  procedure: "запуск"
  args: []

category: "system"

ui:
  kind: "service"
  single_instance: true

permissions:
  system:
    notifications: true

registry_kind: "service"

exports:
  invokes:
    - "система.уведомления.показать"
  ipc_channels:
    - "osnova.notifications.events"

runtime:
  min_osnova_version: "0.1.0"
